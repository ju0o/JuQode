<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JuQode — 주문 서비스</title>
<style>

/* ══════════════════════════════════════════════════════════════════════════
   JuQode Phase 4A — 껍데기
   토큰·기하·리듬은 docs/design/MVP_DESIGN_CONVERGENCE.md 에서 왔다.
   여기서 새 토큰을 만들지 않는다.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#F7F5F2; --surface:#FFFFFF; --sunk:#EDEAE5;
  --ink:#0D0C0B; --ink2:#4A4641; --ink3:#857F77; --ink4:#B5AEA5;
  --hair:#D8D3CC; --attn:#9A5B12; --fail:#8C2B20; --past:#5B6B84;
  --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",
         "Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
  /* 하나의 왼쪽 기준선 — 상단 · 판 · 말하는 줄이 모두 여기 선다 */
  --M:22px;
  --C1:24px;    /* 번호 */
  --C2:112px;   /* 자리 이름 */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;
  text-align:left;cursor:pointer;border-radius:0}
button[aria-disabled="true"]{cursor:default}
:focus{outline:none}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

/* ══ 부팅 확인 — 조용히 빈 화면이 되지 않게 ══════════════════════════════ */
#boot{padding:40px;font-size:15px;color:var(--ink2);line-height:1.7}

/* ══ 제품 창 — 상단 한 줄 · World · 도구 판 하나 · 말하는 한 줄 ══════════ */
.app{height:100%;display:flex;flex-direction:column;background:var(--surface)}

/* ── 상단 한 줄 — 왼쪽 정체 · 가운데 유일한 동사 · 오른쪽 렌즈 ─────────── */
.top{height:38px;flex:none;border-bottom:1px solid var(--hair);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 var(--M);position:relative}
.top .id{display:flex;align-items:baseline;gap:9px;min-width:0}
.top .id b{font-size:13px;font-weight:700;letter-spacing:-.028em;white-space:nowrap}
.top .id .st{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  color:var(--ink3);white-space:nowrap}
.top .id .st.f{color:var(--fail)}
.top .id .st.a{color:var(--attn)}

.verb{justify-self:center;display:flex;align-items:baseline;gap:9px;white-space:nowrap;
  padding:6px 10px;margin:0 -10px}
.verb b{font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.verb i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--ink4)}
.verb:hover b{color:var(--attn)}
.verb.on b{color:var(--attn)}
.verb.on:hover b{color:var(--fail)}

.lens{justify-self:end;display:flex;align-items:center}
.lens button{position:relative;font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;
  color:var(--ink3);padding:11px}
.lens button:last-child{padding-right:0}
.lens button+button::before{content:'';position:absolute;left:0;top:50%;
  width:1px;height:1px;background:var(--ink4)}
.lens button:hover{color:var(--ink)}
.lens button[aria-disabled="true"]{color:var(--ink4)}
.lens button[aria-disabled="true"]:hover{color:var(--ink4)}
.lens button[aria-pressed="true"]{color:var(--ink)}
.lens button[aria-pressed="true"]::after{content:'';position:absolute;left:11px;right:0;
  bottom:-2px;height:2px;background:var(--ink)}
.lens button:last-child[aria-pressed="true"]::after{right:0}

/* ── Software World — 절대 잘리지 않는다. 판이 커지면 몸이 다시 자리잡는다 ── */
.world{flex:1;position:relative;overflow:hidden;background:var(--surface);min-height:0}
.world canvas{position:absolute;left:0;top:0;display:block}
.world.pick canvas{cursor:pointer}

/* ── 도구 판 — 하나. 절대 쌓이지 않는다. 위 경계는 2px 먹선 ─────────────── */
.band{flex:none;background:var(--paper);border-top:2px solid var(--ink);
  padding:11px var(--M) 13px}
.bh2{display:flex;align-items:baseline;gap:10px}
.bh2 .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;color:var(--ink3)}
.bh2 .lb.ok{color:var(--ink)}
.bh2 .lb.a{color:var(--attn)}
.bh2 .sp{flex:1}
.bh2 .ac{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3);
  white-space:nowrap}
.bh2 button.ac:hover{color:var(--ink)}
.bh2 .ac em{font-style:normal;color:var(--ink)}
.bh2 .ac .stop{color:var(--fail)}

/* 지표 — World가 읽히는 순서 그대로. 번호가 World와 지표를 잇는다 */
.ix{margin-top:9px}
.ix .r{display:grid;grid-template-columns:var(--C1) var(--C2) 1fr;align-items:baseline;
  padding:5px 0;position:relative;width:100%}
.ix .r i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink3);
  letter-spacing:.04em}
.ix .r b{font-size:13.5px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
.ix .r span{font-size:12.5px;color:var(--ink3);letter-spacing:-.012em}
.ix .r b em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.13em;
  color:var(--ink3);margin-left:9px;vertical-align:1px}
.ix .r::before{content:'';position:absolute;left:-13px;top:3px;bottom:3px;width:2px;
  background:var(--ink);opacity:0}
.ix button.r:hover::before{opacity:.34}
.ix .r.on::before{opacity:1}
.ix .r.on i{color:var(--ink)}
.ix .r.dim i{color:var(--ink4)}
.ix .r.dim b{color:var(--ink4);font-weight:500}
.ix .r.dim span{color:var(--ink4)}
.ix button.r:hover i{color:var(--ink)}
.ix button.r:hover b{color:var(--ink);font-weight:700}

/* 맥락 — 양식이 아니라 판 안의 접힌 한 줄 */
.ldg{display:flex;align-items:baseline;gap:11px;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--hair)}
.ldg .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;color:var(--ink3);
  white-space:nowrap}
.ldg b{font-size:12.5px;font-weight:500;letter-spacing:-.02em;color:var(--ink2)}
.ldg span{font-size:12.5px;color:var(--ink4)}
.ldg .sp{flex:1}
.ldg .ac{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3)}

/* 결과 — 상자도 배지도 없다. 문장과 계측이다 */
.band.res{padding-top:11px;padding-bottom:15px;animation:rise .40s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.band.res .h{margin-top:9px;font-size:19px;font-weight:700;letter-spacing:-.04em;line-height:1.2}
.band.res .d{font-size:13px;color:var(--ink2);line-height:1.62;margin-top:8px;max-width:660px}
.band.res .ev{margin-top:11px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--ink2)}
.band.res .chg{margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
  color:var(--ink3)}
.band.res .ac2{display:flex;gap:22px;margin-top:12px}
.band.res .ac2 button{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3)}
.band.res .ac2 button:hover{color:var(--ink)}
.band.res .ac2 button.pt{color:var(--past)}
.band.res .ac2 button.pt:hover{color:#3E4E68}

/* 깊이 — 오른쪽 레일이 아니다. 자리 이름에 매달려 아래에서 열리는 해부도 */
.band.deep{padding-top:15px;padding-bottom:0;animation:rise .34s cubic-bezier(.2,.7,.2,1)}
.band.deep .dh{display:flex;align-items:baseline;gap:14px}
.band.deep .dh b{font-size:20px;font-weight:700;letter-spacing:-.04em}
.band.deep .dh span{font-size:12.5px;color:var(--ink3)}
.band.deep .cols{display:grid;grid-template-columns:1.15fr 1fr 1.1fr;margin-top:14px;
  padding-bottom:14px}
.band.deep .cols>div{padding-left:26px;border-left:1px solid var(--hair);min-width:0}
.band.deep .cols>div:first-child{padding-left:0;border-left:0}
.band.deep .ch{font-family:var(--mono);font-size:9.5px;letter-spacing:.19em;color:var(--ink3);
  padding-bottom:9px}
.band.deep .l{font-family:var(--mono);font-size:10.5px;line-height:2.05;color:var(--ink);
  letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band.deep .l u{text-decoration:none;color:var(--ink3);margin-left:9px}
.band.deep .l.g{color:var(--ink3)}
.band.deep .df{display:flex;align-items:baseline;border-top:1px solid var(--hair);
  padding:11px 0 12px;font-size:12.5px;color:var(--ink3)}
.band.deep .df .sp{flex:1}
.band.deep .df button{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3)}
.band.deep .df button:hover{color:var(--ink)}

/* ── 말하는 한 줄 — 상자가 아니다. 주어를 제품이 먼저 쓴 문장이다 ───────── */
.say{flex:none;height:54px;border-top:2px solid var(--ink);background:var(--surface);
  display:flex;align-items:center;padding:0 var(--M)}
.say .subj{font-size:17px;font-weight:700;letter-spacing:-.035em;color:var(--ink);
  white-space:nowrap}
.say .mk{font-style:normal;font-size:13px;color:var(--ink4);margin:0 11px 0 10px;
  transform:translateY(-1px)}
.say input{flex:1;min-width:0;font-family:var(--sans);font-size:17px;letter-spacing:-.03em;
  color:var(--ink);border:0;background:transparent;padding:0;height:34px;
  caret-color:var(--ink)}
.say input::placeholder{color:var(--ink4);opacity:1}
/* 이 줄만은 초점 테두리를 두르지 않는다 — 상자가 생기면 채팅 입력으로 되읽힌다.
   실제로 눌러 보고 알았다: :focus-visible 이 여기에 사각형을 그렸다. */
.say input:focus,.say input:focus-visible{outline:none;box-shadow:none;border:0}
.say .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;color:var(--ink3);
  white-space:nowrap;padding-left:18px}
.say .hint u{text-decoration:none;color:var(--ink)}
.say .hint.na{color:var(--ink4)}

/* ══ 런처 — 카드 갤러리가 아니라 몸과 문제 수의 목록 ═════════════════════ */
.lch{height:100%;overflow:auto;padding:44px 0 40px}
.lch .in{max-width:1080px;margin:0 auto;padding:0 40px}
.lch .mark{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--ink)}
.lch h1{font-size:30px;font-weight:700;letter-spacing:-.042em;margin:14px 0 0;line-height:1.15}
.lch .thesis{font-size:12.5px;color:var(--ink3);margin-top:9px}
.lsec{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink3);
  border-top:1px solid var(--ink);padding-top:10px;margin-top:26px}
.lr{display:grid;grid-template-columns:262px 1fr 96px 92px;align-items:center;
  border-bottom:1px solid var(--hair);padding:10px 0;width:100%}
.lr .mini{width:262px;height:102px;position:relative;overflow:hidden}
.lr .mini canvas{position:absolute;left:0;top:0}
.lr .meta{padding-left:28px;min-width:0}
.lr .meta b{font-size:16px;font-weight:700;letter-spacing:-.032em;display:block}
.lr .meta span{font-size:12.5px;color:var(--ink3);display:block;margin-top:6px}
.lr .when{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--ink4);
  text-align:right}
.lr .cnt{text-align:right}
.lr .cnt em{font-style:normal;font-size:19px;font-weight:700;letter-spacing:-.04em;color:var(--fail)}
.lr .cnt i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  color:var(--ink3);margin-left:7px}
.lr .cnt .ok{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--ink3)}
button.lr:hover .meta b{color:var(--fail)}
button.lr:hover{background:var(--paper)}
.lr[aria-disabled="true"] .meta b{color:var(--ink3)}
.lnew{display:flex;align-items:baseline;margin-top:15px}
.lnew span{font-size:14.5px;font-weight:700;letter-spacing:-.03em;padding-right:26px;
  color:var(--ink4)}
.lnew .sp{flex:1}
.lnew i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--ink4)}
.lnote{margin-top:22px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  color:var(--ink4)}


</style>
</head>
<body>

<!-- 조용히 빈 화면이 되지 않게. app.js 가 이 블록을 지운다. -->
<div id="boot">
  <b>이 화면이 아직 뜨지 않았습니다.</b><br>
  index.html 을 그대로 열어야 합니다. 외부 파일을 불러오지 않으므로
  인터넷도 서버도 필요하지 않습니다.
</div>

<!-- ══ 런처 ═══════════════════════════════════════════════════════════ -->
<section class="lch" id="launcher" hidden>
  <div class="in">
    <div class="mark">JUQODE</div>
    <h1>어떤 Software로 갈까요?</h1>
    <div class="thesis">Developers Code. Vibe Coders Qode.</div>
    <div class="lsec">이어서 하기</div>
    <div id="recent"></div>
    <div class="lsec">새로 가져오기</div>
    <div class="lnew">
      <span>이 컴퓨터에서</span><span>GitHub에서</span><span>빈 Software로</span>
      <div class="sp"></div><i>폴더를 끌어 놓아도 됩니다</i>
    </div>
    <div class="lnote">PHASE 4A 프로토타입 · 주문 서비스만 열립니다</div>
  </div>
</section>

<!-- ══ 작업 공간 — 하나의 껍데기. 상태만 바뀐다 ═══════════════════════ -->
<section class="app" id="ws" hidden>
  <div class="top">
    <div class="id"><b id="swName">주문 서비스</b><span class="st" id="swState"></span></div>
    <button class="verb" id="btnRun" type="button">
      <b id="runLabel">실행</b><i id="runHint"></i>
    </button>
    <div class="lens">
      <button id="lensTime" type="button" aria-disabled="true"
        title="시간은 Phase 4A에서 열리지 않습니다">시간</button>
      <button id="lensConn" type="button" aria-disabled="true"
        title="연결은 Phase 4A에서 열리지 않습니다">연결</button>
      <button id="lensDeep" type="button" aria-pressed="false">깊이</button>
    </div>
  </div>
  <div class="world" id="world"><canvas id="cv"></canvas></div>
  <div class="band" id="band" hidden></div>
  <form class="say" id="say" autocomplete="off">
    <b class="subj" id="subj">주문 서비스</b><i class="mk">▸</i>
    <input id="inp" type="text" placeholder="무엇을 바꿀까요?" aria-label="원하는 변화를 말해보세요">
    <span class="hint" id="hint"></span>
  </form>
</section>

<script>

/* ── src/world.js ────────────────────────────────── */

"use strict";
/* ── 동결된 물리 엔진 — docs/design/mvp-wireframe.html 에서 그대로 옮겼다.
   프로토타입에서 표상을 다시 만들지 않는다. 바꾼 것은 반환 목록 한 줄뿐이다. ── */
var JQ = (function(){
/* ══════════════════════════════════════════════════════════════════════════
   JuQode — Semantic Place
   재료는 3R.4 그대로다. 바뀐 것은 하나뿐이다:
   결의 방향이 상수가 아니라 의미가 정하는 값이 되었다.
   ══════════════════════════════════════════════════════════════════════════ */
var W = 864, H = 470;
var G = 7;
var SURF = 0.060;      // 겉면 레벨
var DG   = 0.034;      // 결 간격
var MASSK= 0.20;       // 질량이 그 자리의 결을 얼마나 조이는가 — 방향은 건드리지 않는다
var WARP = 50;         // 재료의 고정된 흔들림
var BASE_RES = 0.62;
var W0   = 0.20;       // 주변 결의 발언권 — 자리가 없는 곳은 이 방향으로 흐른다
var GDIR = 0.00350;    // 자리의 결도 주변과 같은 간격을 갖는다
var SEM  = 1.06;       // 뜻이 미치는 범위 (질량 타원 대비)
var AMB  = -20;        // 뜻이 없는 곳이 향하는 방향(도)
var SHLD = 0.34;       // 어깨 — 이 폭에서 결이 돈다. 선이 아니다

function resStep(r){ return r < 0.34 ? 4 : (r < 0.70 ? 2 : 1); }
function bandOf(mass){ return mass<0.26?0:(mass<0.62?1:(mass<1.04?2:3)); }

function D(v,k){ return {v:v, t:v, vel:0, k:k||24}; }
function stepD(d,dt){
  if(d.v === d.t && d.vel === 0) return false;
  var c = 2*Math.sqrt(d.k);
  d.vel += ((d.t-d.v)*d.k - d.vel*c)*dt;
  d.v   += d.vel*dt;
  if(Math.abs(d.t-d.v) < 2e-4 && Math.abs(d.vel) < 2e-3){ d.v=d.t; d.vel=0; return false; }
  return true;
}
function stiff(mass){ return 30/(1 + 2.4*(mass||0)); }

/* ── 모델 ─────────────────────────────────────────────────────────────── */
function newModel(){
  return {places:[], byId:{}, seams:[], voids:[], pulses:[], timers:[], breath:null, focus:null};
}
/* 자리 하나 = 의미 하나. 질량도 방향도 이름도 여기 붙는다. 개체가 아니라 성질이다. */
function mkPlace(o){
  var k = stiff(o.mass);
  return {id:o.id, names:o.names||[], mass:o.mass||0, rot:o.rot||0, semantic:o.semantic!==false,
    x:D(o.x,k), y:D(o.y,k), rx:D(o.rx,k), ry:D(o.ry,k), amp:D(o.amp||0,k),
    dir:D(o.dir||0, 14), coh:D(o.coh===undefined?1:o.coh, 16), lab:D(0,20)};
}
function add(m,p){ m.places.push(p); m.byId[p.id]=p; return p; }
function to(m,id,f,v){ var p=m.byId[id]; if(p) p[f].t=v; }
function jump(m,id,f,v){ var p=m.byId[id]; if(p){ p[f].v=v; p[f].t=v; p[f].vel=0; } }
function addSeam(m,o){
  var s={id:o.id, x:o.x, y:o.y, rx:o.rx, ry:o.ry,
    off:D(o.off||0,26), res:D(o.res===undefined?BASE_RES:o.res,26), tint:o.tint||0, brk:o.brk||0};
  m.seams.push(s); return s;
}
function seam(m,id){ for(var i=0;i<m.seams.length;i++) if(m.seams[i].id===id) return m.seams[i]; return null; }

/* ── 격자 ─────────────────────────────────────────────────────────────── */
function newGrid(){
  var cols=Math.ceil(W/G)+1, rows=Math.ceil(H/G)+1, n=cols*rows;
  var wx=new Float32Array(n), wy=new Float32Array(n), flow=new Float32Array(n);
  var agx=new Float32Array(n), agy=new Float32Array(n);
  var i,j,px,py,o,ax,ay,da;
  for(j=0;j<rows;j++) for(i=0;i<cols;i++){
    px=i*G; py=j*G; o=j*cols+i;
    ax=px+26*Math.sin(py*0.0132+0.7)+13*Math.sin(px*0.0207+2.1)+5*Math.sin(px*0.045+0.3);
    ay=py+19*Math.sin(px*0.0111+1.9)+10*Math.sin(py*0.0241+0.4)+4.5*Math.sin(py*0.041+1.1);
    wx[o]=ax; wy[o]=ay;
    /* 주변 결 — 뜻이 없는 곳이 향하는 방향. 완만하게 흔들린다(재료의 성질) */
    da=(AMB+7.5*Math.sin(px*0.0052+py*0.0031+1.1))*Math.PI/180;
    agx[o]=-Math.sin(da)*GDIR; agy[o]=Math.cos(da)*GDIR;
    flow[o]=0.00358*(ay*0.92+ax*0.34)+0.130*Math.sin(ax*0.0068+ay*0.0045+1.2);
  }
  return {cols:cols, rows:rows, wx:wx, wy:wy, flow:flow, agx:agx, agy:agy, warm:false,
    val:new Float32Array(n), gf:new Float32Array(n),
    ws:new Float32Array(n), gxs:new Float32Array(n), gys:new Float32Array(n),
    res:new Float32Array(n), tint:new Uint8Array(n), mask:new Uint8Array(n)};
}
function sampleFlow(gr,x,y){
  var i=Math.round(x/G), j=Math.round(y/G);
  if(i<0)i=0; if(i>gr.cols-1)i=gr.cols-1;
  if(j<0)j=0; if(j>gr.rows-1)j=gr.rows-1;
  return gr.flow[j*gr.cols+i];
}
function addMass(gr,x,y,rx,ry,rot,amp){
  if(Math.abs(amp)<0.004||rx<=1||ry<=1) return;
  var cols=gr.cols, rows=gr.rows, val=gr.val, R=Math.max(rx,ry)+WARP;
  var i0=Math.max(0,Math.floor((x-R)/G)), i1=Math.min(cols-1,Math.ceil((x+R)/G));
  var j0=Math.max(0,Math.floor((y-R)/G)), j1=Math.min(rows-1,Math.ceil((y+R)/G));
  var co=Math.cos(rot), si=Math.sin(rot), i,j,o,px,py,dx,dy,u,v,d2,w;
  for(j=j0;j<=j1;j++) for(i=i0;i<=i1;i++){
    o=j*cols+i; px=gr.wx[o]-x; py=gr.wy[o]-y;
    dx=px*co+py*si; dy=-px*si+py*co;
    u=dx/rx; v=dy/ry; d2=u*u+v*v;
    if(d2>=1) continue;
    w=1-d2; val[o]+=amp*w*w;

}
/* 뜻이 미치는 범위 안에서 결의 방향을 자기 쪽으로 당긴다.
   테두리를 만들지 않는다 — 어깨에서 서서히 이긴다. */
function addDir(gr,p){
  var ax=p.x.v, ay=p.y.v, RX=p.rx.v*SEM, RY=p.ry.v*SEM, rot=p.rot;
  var coh=p.coh.v;
  /* 질량은 자기 결의 기울기를 키운다 = 그 자리의 결이 조여든다.
     방향은 그대로다 — 같은 축을 따라 더 가팔라질 뿐이다. */
  var slope=GDIR*(1+MASSK*p.amp.v);
  var vx=-Math.sin(p.dir.v*Math.PI/180)*slope, vy=Math.cos(p.dir.v*Math.PI/180)*slope;
  var cols=gr.cols, rows=gr.rows, R=Math.max(RX,RY)+WARP;
  var i0=Math.max(0,Math.floor((ax-R)/G)), i1=Math.min(cols-1,Math.ceil((ax+R)/G));
  var j0=Math.max(0,Math.floor((ay-R)/G)), j1=Math.min(rows-1,Math.ceil((ay+R)/G));
  var co=Math.cos(rot), si=Math.sin(rot), i,j,o,px,py,dx,dy,u,v,d2,d,t,w;
  for(j=j0;j<=j1;j++) for(i=i0;i<=i1;i++){
    o=j*cols+i; px=gr.wx[o]-ax; py=gr.wy[o]-ay;
    dx=px*co+py*si; dy=-px*si+py*co;
    u=dx/RX; v=dy/RY; d2=u*u+v*v;
    if(d2>=1) continue;
    d=Math.sqrt(d2); t=(1-d)/SHLD; if(t>1)t=1;
    w=coh*t*t*(3-2*t);
    if(w<0.004) continue;
    gr.ws[o]+=w; gr.gxs[o]+=w*vx; gr.gys[o]+=w*vy;
  }
}
/* 한 지점에서 어떤 뜻이 얼마나 지배하는가 — 가리킨 곳의 의미는 계산된다 */
function meaningAt(m,x,y){
  var out=[], i,p,px,py,dx,dy,u,v,d2,d,t,w,co,si;
  for(i=0;i<m.places.length;i++){
    p=m.places[i]; if(!p.semantic) continue;
    co=Math.cos(p.rot); si=Math.sin(p.rot);
    px=x-p.x.v; py=y-p.y.v;
    dx=px*co+py*si; dy=-px*si+py*co;
    u=dx/(p.rx.v*SEM); v=dy/(p.ry.v*SEM); d2=u*u+v*v;
    if(d2>=1) continue;
    d=Math.sqrt(d2); t=(1-d)/SHLD; if(t>1)t=1;
    w=t*t*(3-2*t);
    if(w>0.02) out.push({p:p, w:w});
  }
  out.sort(function(a,b){ return b.w-a.w; });
  return out;
}
function ellipseVisit(gr,x,y,rx,ry,fn){
  var cols=gr.cols, rows=gr.rows, R=Math.max(rx,ry)+WARP;
  var i0=Math.max(0,Math.floor((x-R)/G)), i1=Math.min(cols-1,Math.ceil((x+R)/G));
  var j0=Math.max(0,Math.floor((y-R)/G)), j1=Math.min(rows-1,Math.ceil((y+R)/G));
  var i,j,o,u,v,d2;
  for(j=j0;j<=j1;j++) for(i=i0;i<=i1;i++){
    o=j*cols+i;
    u=(gr.wx[o]-x)/rx; v=(gr.wy[o]-y)/ry; d2=u*u+v*v;
    if(d2<1) fn(o, Math.sqrt(d2));
  }
}

function compute(gr,m,now,attn,resOv){
  var base=(resOv===undefined? BASE_RES : resOv), i, j, p;
  var n=gr.val.length;
  gr.val.fill(0); gr.res.fill(base); gr.tint.fill(0); gr.mask.fill(0);
  /* ① 몸 */
  for(i=0;i<m.places.length;i++){
    p=m.places[i];
    var a=p.amp.v;
    if(m.breath && m.breath.id===p.id) a += m.breath.amp*Math.sin(now*m.breath.w);
    addMass(gr,p.x.v,p.y.v,p.rx.v,p.ry.v,p.rot,a);
  }
  for(i=0;i<m.pulses.length;i++){
    var pu=m.pulses[i], u=(now-pu.t0)/pu.dur;
    if(u<0||u>1) continue;
    addMass(gr, pu.x0+(pu.x1-pu.x0)*u, pu.y0+(pu.y1-pu.y0)*u, pu.rx, pu.ry, 0, pu.amp*Math.sin(Math.PI*u));
  }
  for(i=0;i<m.voids.length;i++){
    var vd=m.voids[i];
    addMass(gr, vd.x, vd.y, vd.rx*1.55, vd.ry*1.55, 0, -vd.depth);
    ellipseVisit(gr, vd.x, vd.y, vd.rx, vd.ry, function(o){ gr.mask[o]=3; });
  }
  /* ② 방향장 — 자리가 없는 곳은 주변 결로 흐른다 */
  var ws=gr.ws, gxs=gr.gxs, gys=gr.gys, flow=gr.flow;
  for(i=0;i<n;i++){ ws[i]=W0; gxs[i]=W0*gr.agx[i]; gys[i]=W0*gr.agy[i]; }
  for(i=0;i<m.places.length;i++){
    p=m.places[i];
    if(p.semantic && p.coh.v>0.02) addDir(gr,p);
  }
  /* ③ 결 — 방향장 + 질량이 눌러 조인 만큼 */
  var val=gr.val, cols=gr.cols, rows=gr.rows, iw;
  for(i=0;i<n;i++){ iw=1/ws[i]; gxs[i]*=iw; gys[i]*=iw; }
  for(i=0;i<m.seams.length;i++){
    (function(sm){
      var rr=sm.res.v, tn=sm.tint, brk=sm.brk, mr=Math.min(sm.rx,sm.ry), cut=sm.off.v;
      ellipseVisit(gr, sm.x, sm.y, sm.rx, sm.ry, function(o,d){
        var w=(1-d)/0.22; if(w>1)w=1; if(w<0)w=0;
        var f=(w-0.35)/0.30; if(f>1)f=1; if(f<0)f=0;
        if(f>0){ var v2=gr.res[o]+(rr-gr.res[o])*f; if(v2<gr.res[o]) gr.res[o]=v2; }
        if(w>0.45 && tn) gr.tint[o]=tn;
        /* 새 재료의 결은 몸의 결과 이어지지 않는다 — 경계에서 끊긴다 */
        if(cut>0.004){ var dp=(1-d)*mr; if(dp>-3 && dp<(brk?20:11)) gr.mask[o]=3; }
      });
    })(m.seams[i]);
  }
  /* 주의를 받은 자리는 결이 더 촘촘해진다 — 이름이 아니라 몸이 먼저 답한다 */
  for(i=0;i<m.places.length;i++){
    (function(p2){
      if(!p2.semantic||p2.lab.v<0.04) return;
      var st=p2.lab.v;
      ellipseVisit(gr, p2.x.v, p2.y.v, p2.rx.v*1.05, p2.ry.v*1.05, function(o,d){
        var f=(1-d)/0.45; if(f>1)f=1; if(f<0)f=0;
        var r2=base+(1-base)*st*f;
        if(r2>gr.res[o]) gr.res[o]=r2;
      });
    })(m.places[i]);
  }
  if(attn && attn.a>0.02){
    ellipseVisit(gr, attn.x, attn.y, 104, 104, function(o,d){
      var f=(1-d)*attn.a, r2=base+(1-base)*(f>1?1:f);
      if(r2>gr.res[o]) gr.res[o]=r2;
    });
  }
}

/* ── 결 뽑기 ──────────────────────────────────────────────────────────── */
function newPaths(){
  var a=[],i,j;
  for(i=0;i<4;i++){ a.push([]); for(j=0;j<6;j++) a[i].push(new Path2D()); }
  return a;
}
/* ── ① 겉면 — 몸이 끝나는 자리 (등치선 하나) ─────────────────────────── */
function tess(gr,paths,forceTint){
  var cols=gr.cols, rows=gr.rows, val=gr.val, tint=gr.tint, mask=gr.mask;
  var i,j,o,a,b,c,d,mn,mx,lv,tn,ci,xi,yj,xr,yb,tX,rY,bX,lY;
  for(j=0;j<rows-1;j++){
    yj=j*G; yb=yj+G;
    for(i=0;i<cols-1;i++){
      o=j*cols+i; xi=i*G; xr=xi+G;
      a=val[o]; b=val[o+1]; c=val[o+cols+1]; d=val[o+cols];
      mn=a; mx=a;
      if(b<mn)mn=b; else if(b>mx)mx=b;
      if(c<mn)mn=c; else if(c>mx)mx=c;
      if(d<mn)mn=d; else if(d>mx)mx=d;
      if(mx<=SURF||mn>SURF) continue;
      if(mask[o]===2) continue;
      tn=(forceTint===undefined? tint[o] : forceTint);
      lv=SURF;
      ci=(a>lv?1:0)|(b>lv?2:0)|(c>lv?4:0)|(d>lv?8:0);
      if(ci===0||ci===15) continue;
      tX=xi+G*(lv-a)/(b-a); rY=yj+G*(lv-b)/(c-b);
      bX=xi+G*(lv-d)/(c-d); lY=yj+G*(lv-a)/(d-a);
      emit(paths[tn][4],ci,a,b,c,d,lv,xi,yj,xr,yb,tX,rY,bX,lY);
    }
  }
}
/* ── ② 결 — 방향장을 따라 흐르는 선들 ────────────────────────────────────
   등치선으로는 이것을 그릴 수 없다. 방향이 자리마다 다른 장은 하나의 스칼라로
   적분되지 않기 때문이다(회전 성분이 버려진다). 그래서 결을 직접 따라 그린다.
   ──────────────────────────────────────────────────────────────────────── */
var D0=15, SEED_K=0.92, BREAK_K=0.52, STEP=3.0, MAXLEN=760;
function bilin(arr,gr,x,y){
  var fx=x/G, fy=y/G, i=fx|0, j=fy|0, cols=gr.cols;
  if(i<0)i=0; if(j<0)j=0; if(i>gr.cols-2)i=gr.cols-2; if(j>gr.rows-2)j=gr.rows-2;
  var tx=fx-i, ty=fy-j, o=j*cols+i;
  return arr[o]*(1-tx)*(1-ty)+arr[o+1]*tx*(1-ty)+arr[o+cols]*(1-tx)*ty+arr[o+cols+1]*tx*ty;
}
function nearIdx(gr,x,y){
  var i=Math.round(x/G), j=Math.round(y/G);
  if(i<0)i=0; if(j<0)j=0; if(i>gr.cols-1)i=gr.cols-1; if(j>gr.rows-1)j=gr.rows-1;
  return j*gr.cols+i;
}
function streams(gr,paths,attn,forceTint){
  var cols=gr.cols, rows=gr.rows, val=gr.val, res=gr.res, tint=gr.tint, mask=gr.mask;
  var gxs=gr.gxs, gys=gr.gys;
  /* 간격 격자 — 이미 그린 결과 너무 가까우면 새 결을 시작하지 않는다 */
  var CS=D0, gc=Math.ceil(W/CS)+1, gr2=Math.ceil(H/CS)+1;
  var buckets=new Array(gc*gr2); for(var z=0;z<buckets.length;z++) buckets[z]=null;
  function push(x,y){
    var b=((y/CS)|0)*gc+((x/CS)|0);
    if(b<0||b>=buckets.length) return;
    if(!buckets[b]) buckets[b]=[];
    buckets[b].push(x,y);
  }
  function tooClose(x,y,r){
    var bi=(x/CS)|0, bj=(y/CS)|0, r2=r*r, i,j,b,arr,k,dx,dy;
    for(j=bj-1;j<=bj+1;j++) for(i=bi-1;i<=bi+1;i++){
      if(i<0||j<0||i>=gc||j>=gr2) continue;
      arr=buckets[j*gc+i]; if(!arr) continue;
      for(k=0;k<arr.length;k+=2){ dx=arr[k]-x; dy=arr[k+1]-y; if(dx*dx+dy*dy<r2) return true; }
    }
    return false;
  }
  function sepAt(o,x,y){
    var m=val[o], d=D0/(1+0.45*m);
    var r=res[o]; if(r>0.70) d*=0.56; else if(r<0.34) d*=1.7;
    return d;
  }
  function ok(x,y){
    if(x<2||y<2||x>W-2||y>H-2) return 0;
    var o=nearIdx(gr,x,y);
    if(mask[o]===3) return 0;
    return bilin(val,gr,x,y)>SURF ? o : 0;
  }
  /* 한 줄 그리기 — 앞뒤 양쪽으로 자란다 */
  function grow(sx,sy){
    var o0=ok(sx,sy); if(!o0) return null;
    if(tooClose(sx,sy,sepAt(o0,sx,sy)*SEED_K)) return null;
    var pts=[], k, x, y, gx, gy, tx, ty, px, py, o, sgn, run, n;
    for(sgn=1;sgn>=-1;sgn-=2){
      x=sx; y=sy; px=0; py=0; run=[];
      for(k=0;k<MAXLEN/STEP;k++){
        o=ok(x,y); if(!o) break;
        gx=bilin(gxs,gr,x,y); gy=bilin(gys,gr,x,y);
        tx=-gy; ty=gx;
        n=Math.sqrt(tx*tx+ty*ty); if(n<1e-7) break;
        tx/=n; ty/=n; tx*=sgn; ty*=sgn;
        if(px||py){ if(tx*px+ty*py<0){ tx=-tx; ty=-ty; } }
        if(k>1 && tooClose(x,y,sepAt(o,x,y)*BREAK_K)) break;
        run.push(x,y); px=tx; py=ty;
        x+=tx*STEP; y+=ty*STEP;
      }
      if(sgn===1) pts=run; else { for(k=run.length-2;k>=0;k-=2) pts.unshift(run[k],run[k+1]); }
    }
    if(pts.length<10) return null;
    var mid=(pts.length>>1)&~1;
    var o1=nearIdx(gr,pts[mid],pts[mid+1]);
    var tn;
    if(forceTint!==undefined) tn=forceTint;
    else {                       /* 선 전체에서 투표 — 상태는 선 하나 단위로 읽힌다 */
      var vote=[0,0,0,0], q, oq;
      for(q=0;q<pts.length;q+=2){ oq=nearIdx(gr,pts[q],pts[q+1]); vote[tint[oq]]++; }
      tn=0; var bestv=0;
      for(q=1;q<4;q++) if(vote[q]>bestv && vote[q]*3>pts.length/2){ bestv=vote[q]; tn=q; }
    }
    var pth=paths[tn][bandOf(val[o1])];
    pth.moveTo(pts[0],pts[1]);
    for(k=2;k<pts.length;k+=2) pth.lineTo(pts[k],pts[k+1]);
    for(k=0;k<pts.length;k+=2) push(pts[k],pts[k+1]);
    return pts;
  }
  /* 씨앗은 이미 그린 결의 옆에서 나온다 — 고르게 채워지고, 난수는 없다 */
  var queue=[], head=0, best=-1, bx=0, by=0, i2, j2, oo;
  for(j2=0;j2<rows;j2++) for(i2=0;i2<cols;i2++){
    oo=j2*cols+i2; if(val[oo]<=SURF||mask[oo]===3) continue;
    if(val[oo]>best){ best=val[oo]; bx=i2*G; by=j2*G; }
  }
  if(best<0) return;
  queue.push(bx,by);
  var guard=0;
  while(head<queue.length && guard++<12000){
    var qx=queue[head], qy=queue[head+1]; head+=2;
    var pts=grow(qx,qy); if(!pts) continue;
    for(var k2=0;k2<pts.length;k2+=2){
      if(k2%8) continue;
      var o3=nearIdx(gr,pts[k2],pts[k2+1]), dd=sepAt(o3,pts[k2],pts[k2+1]);
      var ax2=bilin(gxs,gr,pts[k2],pts[k2+1]), ay2=bilin(gys,gr,pts[k2],pts[k2+1]);
      var nn=Math.sqrt(ax2*ax2+ay2*ay2); if(nn<1e-7) continue;
      ax2/=nn; ay2/=nn;
      queue.push(pts[k2]+ax2*dd, pts[k2+1]+ay2*dd);
      queue.push(pts[k2]-ax2*dd, pts[k2+1]-ay2*dd);
    }
  }
  /* 끊긴 자리로 둘러싸인 구역은 옆에서 씨앗이 넘어가지 못한다 — 남은 곳을 훑어 채운다.
     그래야 이음매 안쪽에도 결이 있고, 그 결이 바깥과 만나지 못하는 것이 보인다. */
  for(j2=0;j2<rows;j2+=2) for(i2=0;i2<cols;i2+=2){
    oo=j2*cols+i2; if(val[oo]<=SURF||mask[oo]===3) continue;
    grow(i2*G, j2*G);
  }
}
function emit(p,ci,a,b,c,d,lv,xi,yj,xr,yb,tX,rY,bX,lY){
  switch(ci){
    case 1: case 14: p.moveTo(xi,lY); p.lineTo(tX,yj); break;
    case 2: case 13: p.moveTo(tX,yj); p.lineTo(xr,rY); break;
    case 3: case 12: p.moveTo(xi,lY); p.lineTo(xr,rY); break;
    case 4: case 11: p.moveTo(xr,rY); p.lineTo(bX,yb); break;
    case 6: case 9:  p.moveTo(tX,yj); p.lineTo(bX,yb); break;
    case 7: case 8:  p.moveTo(xi,lY); p.lineTo(bX,yb); break;
    default:
      var ctr=(a+b+c+d)*0.25;
      var joinAC=(ci===5)?(ctr>lv):(ctr<=lv);
      if(joinAC){ p.moveTo(tX,yj); p.lineTo(xr,rY); p.moveTo(xi,lY); p.lineTo(bX,yb); }
      else      { p.moveTo(xi,lY); p.lineTo(tX,yj); p.moveTo(xr,rY); p.lineTo(bX,yb); }
  }
}
var TSTR=['13,12,11','154,91,18','140,43,32','91,107,132'];
var BA=[0.26,0.40,0.58,0.78,0.46,0.15], BW=[0.55,0.62,0.72,0.86,0.95,0.58];
function drawSet(ctx,paths,dim){
  for(var t=0;t<4;t++){
    var boost=(t===1||t===2)?1.35:1;
    for(var b=0;b<6;b++){
      var al=BA[b]*boost*dim; if(al>0.96) al=0.96;
      ctx.strokeStyle='rgba('+TSTR[t]+','+al.toFixed(3)+')';
      ctx.lineWidth=BW[b]*(dim<1?0.85:1);
      ctx.stroke(paths[t][b]);
    }
  }
}
return {W:W,H:H,G:G,SURF:SURF,DG:DG,BASE_RES:BASE_RES,SEM:SEM,
  TSTR:TSTR,BA:BA,BW:BW,bandOf:bandOf,stiff:stiff,
  D:D,stepD:stepD,newModel:newModel,mkPlace:mkPlace,add:add,to:to,jump:jump,
  addSeam:addSeam,seam:seam,newGrid:newGrid,compute:compute,meaningAt:meaningAt,
  newPaths:newPaths,tess:tess,streams:streams,drawSet:drawSet};
})();

"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   JuQode Phase 4A — 하나의 기계, 아홉 개의 상태

   여덟 개의 설계 프레임은 여덟 개의 페이지가 아니다.
   껍데기는 그대로 있고 그 안의 상태가 바뀐다. 이 파일이 그 상태 기계다.

   목(mock)인 것    : Software 실행 · 코딩 에이전트 · 파일 · 결과 수치
   목이 아닌 것     : 사용자의 상호작용 전부
   ══════════════════════════════════════════════════════════════════════════ */
(function(){

var Q = JQ;
var MAC = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
var RUNKEY = MAC ? '\u2318R' : 'CTRL R';
var DPR = Math.min(2, window.devicePixelRatio || 1);

/* ── 결 그리기 — 굵기를 화면 픽셀 기준으로 고정한다(축소해도 희미해지지 않게) ── */
function paint(ctx, paths, dim, lwK){
  var T=Q.TSTR, BA=Q.BA, BW=Q.BW, t, b, al;
  for(t=0;t<4;t++){
    var boost=(t===1||t===2)?1.35:1;
    for(b=0;b<6;b++){
      al=BA[b]*boost*dim; if(al>0.96) al=0.96; if(al<0.002) continue;
      ctx.strokeStyle='rgba('+T[t]+','+al.toFixed(3)+')';
      ctx.lineWidth=BW[b]*lwK;
      ctx.stroke(paths[t][b]);
    }
  }
}
/* ── 집힘 = 나머지가 물러나는 것. 테두리를 만들지 않는다 ────────────────── */
var poolCv=null;
function lightPool(paths, pl, lwK){
  if(!poolCv){ poolCv=document.createElement('canvas'); }
  if(poolCv.width!==Q.W*DPR || poolCv.height!==Q.H*DPR){
    poolCv.width=Q.W*DPR; poolCv.height=Q.H*DPR;
  }
  var oc=poolCv.getContext('2d');
  oc.setTransform(1,0,0,1,0,0);
  oc.clearRect(0,0,poolCv.width,poolCv.height);
  oc.setTransform(DPR,0,0,DPR,0,0);
  oc.lineCap='round'; oc.lineJoin='round';
  oc.globalCompositeOperation='source-over';
  paint(oc,paths,1,lwK);
  oc.setTransform(DPR,0,0,DPR,0,0);
  oc.globalCompositeOperation='destination-in';
  oc.translate(pl.x.v,pl.y.v); oc.rotate(pl.rot);
  oc.scale(pl.rx.v*1.52, pl.ry.v*1.62);
  var g=oc.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,'rgba(0,0,0,1)');
  g.addColorStop(0.50,'rgba(0,0,0,1)');
  g.addColorStop(0.78,'rgba(0,0,0,0.55)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  oc.fillStyle=g; oc.beginPath(); oc.arc(0,0,1,0,6.2832); oc.fill();
  return poolCv;
}

/* ══ 상태 ═══════════════════════════════════════════════════════════════
   흩어진 boolean 더미를 만들지 않는다. 화면은 이 객체의 함수다.          */
var S = {
  screen : 'launcher',   /* launcher | workspace                          */
  phase  : 'idle',       /* idle focused prepared working settled running */
  focus  : null,         /* 집힌 자리 id                                  */
  lens   : null,         /* null | 'deep'                                 */
  input  : '',
  problems : ['pay','store'],   /* 순서 = 지표 번호 = World의 번호        */
  fixed  : {},
  result : null,
  showChanged : false,
  runOn  : false, runT0 : 0,
  workKey: null,  workT0: 0,
  justNow: null,
  hover  : null,
  note   : null,         /* 판 머리에 한 줄. 다음 행동에서 사라진다        */
  obsNote: null,
  past   : null          /* 이전 평형 — 되돌리기용                        */
};

function placeName(id){
  for(var i=0;i<PLACES.length;i++) if(PLACES[i].id===id) return PLACES[i].name;
  return null;
}
function problemAt(placeId){
  for(var i=0;i<S.problems.length;i++)
    if(PROBLEM_DEFS[S.problems[i]].place===placeId) return S.problems[i];
  return null;
}
function ordOf(key){ return S.problems.indexOf(key)+1; }
function fmt(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  return (s/60|0)+':'+('0'+(s%60)).slice(-2);
}

/* ══ 몸 — 모델은 하나뿐이다. 상태가 바뀌면 목표값만 바꾼다 ══════════════ */
var M=null, GRID=null, SEAMS={}, FK=Q.D(0,20);

function newBody(problemKeys, focusId){
  var m=Q.newModel(), i;
  Q.add(m,Q.mkPlace({id:'base',semantic:false,x:410,y:268,rx:336,ry:156,
    rot:-0.05,amp:0.40,mass:0.9}));
  for(i=0;i<PLACES.length;i++){
    var a=PLACES[i];
    Q.add(m,Q.mkPlace({id:a.id,names:[a.name],x:a.x,y:a.y,rx:a.rx,ry:a.ry,
      rot:a.rot,amp:a.amp,mass:a.mass,dir:a.dir}));
  }
  for(i=0;i<VOIDS.length;i++) m.voids.push(VOIDS[i]);
  return m;
}
function buildMain(){
  M=newBody(); GRID=Q.newGrid(); SEAMS={};
  syncWorld(true);
}
/* 상태 → 몸. 개별 값을 튕겨 보내고 물리가 나머지를 한다. */
function syncWorld(instant){
  var i,k,p,def;
  /* ① 자리의 질량 — 문제가 있으면 부풀고, 고쳐지면 새 평형으로 가라앉는다 */
  for(i=0;i<PLACES.length;i++){
    var a=PLACES[i]; p=M.byId[a.id];
    k=problemAt(a.id);
    var amp=a.amp;
    if(k) amp=PROBLEM_DEFS[k].amp;
    else { for(var fk in S.fixed) if(S.fixed[fk] && PROBLEM_DEFS[fk].place===a.id)
             amp=PROBLEM_DEFS[fk].settledAmp; }
    p.amp.t=amp;
    if(S.workKey && PROBLEM_DEFS[S.workKey].place===a.id) p.rx.t=a.rx*1.14;
    else p.rx.t=a.rx;
    /* ② 집힘 — 집힌 자리의 결은 조여들고 나머지는 발언권을 잃는다 */
    var on=(a.id===S.focus);
    p.coh.t = S.focus ? (on?1.55:0.40) : 1;
    p.lab.t = on?1:0;
    if(instant){ p.amp.v=p.amp.t; p.rx.v=p.rx.t; p.coh.v=p.coh.t; p.lab.v=p.lab.t; }
  }
  /* ③ 이음매 — 문제 하나 = 이음매 하나 */
  for(i=0;i<S.problems.length;i++){
    k=S.problems[i]; def=PROBLEM_DEFS[k];
    if(!SEAMS[k]){
      var s=Q.addSeam(M,{id:k,x:def.seam.x,y:def.seam.y,rx:def.seam.rx,ry:def.seam.ry,
        off:0,res:Q.BASE_RES,tint:def.seam.tint,brk:def.seam.brk||0});
      SEAMS[k]=s;
      if(instant){ s.off.v=def.seam.off; s.res.v=def.seam.res; }
    }
    SEAMS[k].dying=false;
    SEAMS[k].tint=def.seam.tint;
    SEAMS[k].off.t=def.seam.off;
    SEAMS[k].res.t=def.seam.res;
  }
  for(k in SEAMS){
    if(S.problems.indexOf(k)<0){
      /* 상태가 바뀌었으므로 색은 즉시 사라지고, 결은 눈에 보이게 다시 맞춰진다 */
      SEAMS[k].tint=0; SEAMS[k].off.t=0; SEAMS[k].res.t=Q.BASE_RES; SEAMS[k].dying=true;
    }
  }
  /* ④ 일하는 동안 — 그 자리만 실제로 흔들린다 */
  M.breath = (S.phase==='working' && S.workKey)
    ? {id:PROBLEM_DEFS[S.workKey].place, amp:0.085, w:0.0058} : null;
  FK.t = S.focus?1:0;
  if(instant) FK.v=FK.t;
  reapSeams();
}
function reapSeams(){
  for(var k in SEAMS){
    var s=SEAMS[k];
    if(s.dying && s.off.v<0.004){
      var i=M.seams.indexOf(s); if(i>=0) M.seams.splice(i,1);
      delete SEAMS[k];
    }
  }
}

/* ══ 애니메이션 — 상태 전이는 잘라 붙이지 않는다. 몸이 움직인다 ══════════ */
var raf=0, lastTs=0, cvSize={w:0,h:0}, scaleNow=1;
function req(){ if(!M) return; if(!raf) raf=requestAnimationFrame(tick); }
function tick(ts){
  raf=0;
  if(!M) return;
  var dt=Math.min(0.034,(ts-lastTs)/1000); if(!(dt>0)) dt=0.016; lastTs=ts;
  var moving=false, i, p, k;
  for(i=0;i<M.places.length;i++){
    p=M.places[i];
    moving = Q.stepD(p.amp,dt)|moving; moving = Q.stepD(p.rx,dt)|moving;
    moving = Q.stepD(p.coh,dt)|moving; moving = Q.stepD(p.lab,dt)|moving;
  }
  for(i=0;i<M.seams.length;i++){
    moving = Q.stepD(M.seams[i].off,dt)|moving;
    moving = Q.stepD(M.seams[i].res,dt)|moving;
  }
  moving = Q.stepD(FK,dt)|moving;
  reapSeams();
  draw(ts);
  if(S.phase==='working' || S.runOn) clocks();
  if(moving || S.phase==='working' || S.runOn) req();
}
function clocks(){
  var t=performance.now();
  var el=document.getElementById('clk');
  if(el) el.textContent = fmt(t - (S.phase==='working'?S.workT0:S.runT0));
  var rh=document.getElementById('runHint');
  if(S.runOn && rh) rh.textContent = fmt(t-S.runT0)+' · 멈추기';
}

/* ── 몸을 그린다. 판이 커지면 잘리지 않고 다시 자리잡는다 ────────────────── */
var BB={x0:120,y0:104,x1:754,y1:448};
function draw(now){
  var host=document.getElementById('world'); if(!host) return;
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var hw=host.clientWidth, hh=host.clientHeight;
  if(hw<2||hh<2) return;
  var s=Math.min((hw-150)/(BB.x1-BB.x0),(hh-64)/(BB.y1-BB.y0));
  s=Math.max(0.52,Math.min(1.70,s)); scaleNow=s;
  if(cvSize.w!==Q.W*DPR || cvSize.h!==Q.H*DPR){
    cv.width=Q.W*DPR; cv.height=Q.H*DPR; cvSize={w:cv.width,h:cv.height};
  }
  var lwK=0.95/s;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,Q.W,Q.H);
  ctx.lineCap='round'; ctx.lineJoin='round';

  Q.compute(GRID,M,now||0,null);
  var P=Q.newPaths(); Q.tess(GRID,P); Q.streams(GRID,P,null);

  var fk=FK.v, fp=S.focus?M.byId[S.focus]:null;
  var dimBase=(S.lens==='deep')?0.26:0.42;
  paint(ctx,P,1-fk*(1-dimBase),lwK);
  if(fp && fk>0.012){
    var off=lightPool(P,fp,lwK);
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha=Math.min(1,fk);
    ctx.drawImage(off,0,0);
    ctx.restore();
  }
  drawMarks(ctx,s,fk);

  cv.style.width=(Q.W*s)+'px'; cv.style.height=(Q.H*s)+'px';
  cv.style.left=Math.round(hw/2 - 437*s)+'px';
  cv.style.top =Math.round(hh/2 - 275*s)+'px';
}
/* 번호는 World가 스스로 붙인다. 아래 지표의 같은 번호와 같은 것을 가리킨다.
   이름은 집혔거나 가리켰을 때만 뒤따른다 — 지도와 범례의 관계다. */
function drawMarks(ctx,s,fk){
  var list=[], i, k, def, p;
  for(i=0;i<S.problems.length;i++){
    k=S.problems[i]; def=PROBLEM_DEFS[k]; p=M.byId[def.place]; if(!p) continue;
    list.push({p:p,n:String(i+1),
      name:(def.place===S.focus)?def.title:null,
      strong:(def.place===S.focus)});
  }
  if(S.focus && !problemAt(S.focus)){
    p=M.byId[S.focus];
    if(p) list.push({p:p,n:'',name:placeName(S.focus),strong:true});
  }
  if(S.hover && S.hover!==S.focus && !problemAt(S.hover)){
    p=M.byId[S.hover];
    if(p) list.push({p:p,n:'',name:placeName(S.hover),strong:false,soft:true});
  }
  if(S.hover && S.hover!==S.focus && problemAt(S.hover)){
    for(i=0;i<list.length;i++) if(list[i].p.id===S.hover){
      list[i].name=PROBLEM_DEFS[problemAt(S.hover)].title; list[i].soft=true;
    }
  }
  ctx.textBaseline='middle'; ctx.textAlign='left';
  var nf='500 '+(14/s).toFixed(2)+'px '+'ui-monospace,Menlo,monospace';
  var tf='700 '+(15/s).toFixed(2)+'px "Noto Sans KR","Malgun Gothic",sans-serif';
  for(i=0;i<list.length;i++){
    var it=list[i], px=it.p.x.v, py=it.p.y.v, nw=0, tw=0, gap=12/s;
    if(it.n){ ctx.font=nf; nw=ctx.measureText(it.n).width; }
    if(it.name){ ctx.font=tf; tw=ctx.measureText(it.name).width; }
    var tot=nw+(it.n&&it.name?gap:0)+tw, sx=px-tot/2;
    ctx.miterLimit=2;
    ctx.strokeStyle='rgba(255,255,255,0.90)'; ctx.lineWidth=4.5/s;
    if(it.n){ ctx.font=nf; ctx.strokeText(it.n,sx,py); }
    if(it.name){ ctx.font=tf; ctx.strokeText(it.name,sx+nw+(it.n?gap:0),py); }
    if(it.n){
      ctx.font=nf;
      ctx.fillStyle=it.strong?'rgba(13,12,11,0.95)':'rgba(13,12,11,'+(0.72*(1-fk*0.42)).toFixed(2)+')';
      ctx.fillText(it.n,sx,py);
    }
    if(it.name){
      ctx.font=tf;
      ctx.fillStyle=it.soft?'rgba(74,70,65,0.86)':'rgba(13,12,11,0.96)';
      ctx.fillText(it.name,sx+nw+(it.n?gap:0),py);
    }
    ctx.lineCap='round'; ctx.lineJoin='round';
  }
}

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  if(S.phase==='running'){

function render(){
  document.getElementById('launcher').hidden = (S.screen!=='launcher');
  document.getElementById('ws').hidden       = (S.screen!=='workspace');
  if(S.screen!=='workspace') return;

  var n=S.problems.length;

  /* 상단 왼쪽 — 상태는 늘 사람 말 한 마디로 있다 */
  var st=document.getElementById('swState');
  if(S.phase==='working'){ st.textContent='고치는 중 · 문제 '+n; st.className='st a'; }
  else if(n){ st.textContent='문제 '+n; st.className='st f'; }
  else { st.textContent='확인됨'; st.className='st'; }

  /* 상단 가운데 — 유일한 동사 */
  var run=document.getElementById('btnRun');
  document.getElementById('runLabel').textContent = S.runOn?'실행 중':'실행';
  document.getElementById('runHint').textContent  = S.runOn?fmt(performance.now()-S.runT0)+' · 멈추기':RUNKEY;
  run.className = 'verb'+(S.runOn?' on':'');
  run.setAttribute('aria-pressed', S.runOn?'true':'false');

  /* 상단 오른쪽 — 렌즈 */
  var ld=document.getElementById('lensDeep');
  ld.setAttribute('aria-pressed', S.lens==='deep'?'true':'false');
  if(S.focus){ ld.removeAttribute('aria-disabled'); ld.title='이 자리의 해부도를 엽니다'; }
  else { ld.setAttribute('aria-disabled','true'); ld.title='먼저 자리를 하나 고르세요'; }

  /* 도구 판 — 하나. 절대 쌓이지 않는다 */
  var band=document.getElementById('band');
  var show = !!(S.problems.length || S.phase!=='idle' || S.note || S.obsNote || S.lens);
  band.hidden = !show;
  if(show){
    var b=bandHTML();
    band.className='band'+(b.cls?' '+b.cls:'');
    band.innerHTML=b.html;
  }

  /* 말하는 한 줄 — 주어는 제품이 쓴다 */
  document.getElementById('subj').textContent = S.focus? placeName(S.focus) : '주문 서비스';
  var hint=document.getElementById('hint'), inp=document.getElementById('inp');
  inp.value=S.input;
  if(S.input.trim() && S.focus && problemAt(S.focus)){
    hint.className='hint'; hint.innerHTML='<u>⏎</u> QODE';
  } else if(S.input.trim() && !S.focus){
    hint.className='hint na'; hint.textContent='문제 번호를 누르세요';
  } else if(S.input.trim() && S.focus){
    hint.className='hint na'; hint.textContent='이 자리엔 고칠 문제가 없어요';
  } else if(S.phase==='working'){
    var other=n-(S.workKey?1:0);
    hint.className='hint'; hint.textContent = other>0?'다른 문제 '+other:'';
  } else { hint.className='hint'; hint.textContent=''; }

  document.getElementById('world').className='world'+(S.screen==='workspace'?' pick':'');
  req();
}

/* ══ 행동 ═══════════════════════════════════════════════════════════════ */
var workTimer=0, runTimer=0;

function clearNote(){ S.note=null; S.obsNote=null; }
/* 무엇을 누르든 커서는 말하는 줄로 돌아온다 — 치는 것이 주 행위이므로.
   실제로 눌러 보고 알았다: 이것이 없으면 Enter 가 방금 누른 버튼을 다시 누른다. */
function refocus(){
  if(S.screen!=='workspace') return;
  var inp=document.getElementById('inp');
  if(inp && document.activeElement!==inp) inp.focus({preventScroll:true});
}

function focusPlace(id){
  clearNote();
  if(S.phase==='working') return;
  S.focus = (S.focus===id)?null:id;
  if(!S.focus) S.lens=null;
  S.phase = S.focus ? (S.input.trim()&&problemAt(S.focus)?'prepared':'focused') : 'idle';
  if(S.phase!=='settled') S.result=null;
  syncWorld(); render();
}
function clearFocus(){
  clearNote();
  S.focus=null; S.lens=null; S.input=''; S.phase='idle'; S.result=null;
  syncWorld(); render();
}
function snapshot(){
  return {problems:S.problems.slice(), fixed:JSON.parse(JSON.stringify(S.fixed)),
          focus:S.focus, justNow:S.justNow};
}
function startQode(){
  clearNote();
  if(!S.input.trim()) return;
  if(!S.focus){ S.note='고칠 문제를 먼저 고르세요'; render(); return; }
  var k=problemAt(S.focus);
  if(!k){ S.note='이 자리엔 아직 고칠 문제가 없어요'; render(); return; }
  S.past=snapshot();
  S.workKey=k; S.workT0=performance.now();
  S.phase='working'; S.lens=null; S.input=''; S.justNow=null; S.result=null;
  syncWorld(); render();
  clearTimeout(workTimer); workTimer=setTimeout(finishQode,2700);
}
function finishQode(){
  var k=S.workKey; if(!k) return;
  S.fixed[k]=true;
  S.problems=S.problems.filter(function(x){ return x!==k; });
  S.result={key:k, def:PROBLEM_DEFS[k]};
  S.showChanged=false;
  S.phase='settled'; S.workKey=null;
  S.focus=null;                     /* 몸이 통째로 새 평형으로 가라앉는다 */
  syncWorld(); render();
}
function stopWork(){
  clearTimeout(workTimer);
  var k=S.workKey; S.workKey=null;
  S.phase = k?'focused':'idle';
  S.focus = k?PROBLEM_DEFS[k].place:null;
  syncWorld(); render();
}
function rollback(){
  if(!S.past) return;
  S.problems=S.past.problems.slice();
  S.fixed=S.past.fixed;
  S.justNow=S.past.justNow;
  S.focus=S.past.focus;
  S.result=null; S.showChanged=false;
  S.phase=S.focus?'focused':'idle';
  S.past=null;
  syncWorld(); render();
}
function toggleRun(){
  clearNote();
  if(S.runOn){
    S.runOn=false; clearTimeout(runTimer);
    if(S.phase==='running') S.phase=S.focus?'focused':'idle';
    render(); return;
  }
  if(S.phase==='working') return;
  S.runOn=true; S.runT0=performance.now(); S.phase='running';
  S.lens=null; S.result=null; S.justNow=null;
  render(); req();
  clearTimeout(runTimer); runTimer=setTimeout(observe,2400);
}
/* 실행은 입력이 아니라 관측이다. 실제 동작이 몸에 들어온다. */
function observe(){
  var k=RUN_OBSERVE.finds;
  if(S.problems.indexOf(k)<0 && !S.fixed[k]){
    S.problems.unshift(k);                       /* 새 문제가 1번이 된다 */
    S.justNow=k;
    S.focus=PROBLEM_DEFS[k].place;               /* 그 자리가 스스로 집힌다 */
    S.phase='focused'; S.obsNote=null;
  } else {
    S.justNow=null; S.focus=null; S.phase='idle';
    S.obsNote = S.fixed[k]?RUN_OBSERVE.clean:RUN_OBSERVE.known;
  }
  syncWorld(); render();
}
function toggleDeep(){
  if(!S.focus) return;
  S.lens = (S.lens==='deep')?null:'deep';
  render();
}

function orderMini(){
  var m=newBody();
  var d1=PROBLEM_DEFS.pay.seam, d2=PROBLEM_DEFS.store.seam, s;
  s=Q.addSeam(m,{id:'a',x:d1.x,y:d1.y,rx:d1.rx,ry:d1.ry,off:d1.off,res:d1.res,tint:d1.tint});
  s.off.v=d1.off; s.res.v=d1.res;
  s=Q.addSeam(m,{id:'b',x:d2.x,y:d2.y,rx:d2.rx,ry:d2.ry,off:d2.off,res:d2.res,tint:d2.tint});
  s.off.v=d2.off; s.res.v=d2.res;
  m.byId.pay.amp.v=PROBLEM_DEFS.pay.amp; m.byId.store.amp.v=PROBLEM_DEFS.store.amp;
  return m;
}
function paintMini(cv,m){
  var s=0.33, lwK=1.05/s;
  cv.width=Q.W*DPR; cv.height=Q.H*DPR;
  var ctx=cv.getContext('2d'); ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  var gr=Q.newGrid(); Q.compute(gr,m,0,null);
  var P=Q.newPaths(); Q.tess(gr,P); Q.streams(gr,P,null);
  paint(ctx,P,1.10,lwK);
  cv.style.width=(Q.W*s)+'px'; cv.style.height=(Q.H*s)+'px';
  cv.style.left=Math.round(131 - 437*s)+'px';
  cv.style.top =Math.round(51 - 275*s)+'px';
}
function buildLauncher(){
  var host=document.getElementById('recent'), h='', i;
  for(i=0;i<RECENT.length;i++){
    var r=RECENT[i];
    var cnt = r.open ? '<em>'+S.problems.length+'</em><i>문제</i>'
                     : '<span class="ok">확인됨</span>';
    h += '<'+(r.open?'button':'div')+' class="lr" '
      +(r.open?'type="button" data-open="'+r.id+'"':'aria-disabled="true" '
        +'title="Phase 4A 프로토타입에서는 주문 서비스만 열립니다"')+'>'
      +'<div class="mini"><canvas id="mini-'+r.id+'"></canvas></div>'
      +'<div class="meta"><b>'+esc(r.name)+'</b><span>'+esc(r.human)+'</span></div>'
      +'<div class="when">'+esc(r.when)+'</div>'
      +'<div class="cnt">'+cnt+'</div>'
      +'</'+(r.open?'button':'div')+'>';
  }
  host.innerHTML=h;
  paintMini(document.getElementById('mini-order'), orderMini());
  paintMini(document.getElementById('mini-dash'),  buildDash());

  host.addEventListener('click',function(e){
    var b=e.target.closest('[data-open]'); if(!b) return;
    openSoftware();
  });
}
function openSoftware(){
  S.screen='workspace'; S.phase='idle';
  render();
  requestAnimationFrame(function(){ buildMain(); draw(0); render(); refocus(); });
}

/* ══ 사건 ═══════════════════════════════════════════════════════════════ */
function wire(){
  document.getElementById('btnRun').addEventListener('click',function(){ toggleRun(); refocus(); });
  document.getElementById('lensDeep').addEventListener('click',function(){ toggleDeep(); refocus(); });

  document.getElementById('band').addEventListener('click',function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var a=b.getAttribute('data-act');
    if(a==='pick')       focusPlace(PROBLEM_DEFS[b.getAttribute('data-key')].place);
    else if(a==='clearFocus') clearFocus();
    else if(a==='stopWork')   stopWork();
    else if(a==='stopRun')    toggleRun();
    else if(a==='changed'){ S.showChanged=!S.showChanged; render(); }
    else if(a==='rollback')   rollback();
    else if(a==='closeDeep'){ S.lens=null; render(); }
    refocus();
  });

  var inp=document.getElementById('inp');
  inp.addEventListener('input',function(){
    S.input=inp.value; clearNote();
    if(S.focus && problemAt(S.focus))
      S.phase = S.input.trim()?'prepared':'focused';
    render(); inp.focus();
  });
  document.getElementById('say').addEventListener('submit',function(e){
    e.preventDefault(); startQode();
  });

  /* World 를 직접 겨냥한다 — SEE → POINT → SAY */
  var cv=document.getElementById('cv');
  function at(e){
    var r=cv.getBoundingClientRect();
    var ex=(e.clientX-r.left)/scaleNow, ey=(e.clientY-r.top)/scaleNow;
    var hit=Q.meaningAt(M,ex,ey);
    return hit.length?hit[0].p.id:null;
  }
  cv.addEventListener('mousemove',function(e){
    if(!M) return;
    var id=at(e);
    if(id!==S.hover){ S.hover=id; cv.style.cursor=id?'pointer':'default'; req(); }
  });
  cv.addEventListener('mouseleave',function(){ if(S.hover){ S.hover=null; req(); } });
  cv.addEventListener('click',function(e){
    if(!M) return;
    var id=at(e); if(id){ focusPlace(id); refocus(); }
  });

  window.addEventListener('keydown',function(e){
    if(S.screen!=='workspace') return;
    if((e.metaKey||e.ctrlKey) && (e.key==='r'||e.key==='R')){ e.preventDefault(); toggleRun(); }
    else if(e.key==='Escape'){
      if(S.lens){ S.lens=null; render(); }
      else if(S.focus) clearFocus();
    }
  });
  window.addEventListener('resize',function(){ if(M){ draw(performance.now()); } });
}
