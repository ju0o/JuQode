<!doctype html>
<!-- 생성된 파일이다. 고치려면 src/ 를 고치고 `node build.mjs` -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>JuQode — Software Workspace</title>
<style>/*{{CSS}}*/</style>
</head>
<body>
<!-- 부팅 확인. JS 가 뜨면 app.js 가 이 블록을 지운다.
     이 문장이 보인다는 것은 스크립트가 실행되지 않았다는 뜻이다 (조용히 깨지지 않게). -->
<div id="bootmsg" style="position:fixed;inset:0;z-index:999;background:#F7F5F2;
  font:15px/1.7 -apple-system,'Malgun Gothic',sans-serif;color:#0D0C0B;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px;text-align:center">
  <div style="font-weight:700;font-size:19px">화면이 아직 뜨지 않았습니다</div>
  <div style="color:#4A4641">이 파일은 하나로 완결되어 있어 인터넷도 서버도 필요하지 않습니다.<br>
    브라우저에서 JavaScript 가 꺼져 있으면 이 문장이 남습니다.</div>
  <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#857F77;letter-spacing:.06em">
    JuQode prototype · self-contained</div>
</div>
<div class="app">

  <div class="chrome">
    <span class="wm">JuQode</span>
    <button class="back" id="back">← 밖으로</button>
    <span class="sp"></span>
    <span class="agent" id="agent"><i></i><span id="agentText">Claude Code · 연결됨</span></span>
    <span class="path">C:\Desktop\MyService</span>
  </div>

  <div class="body">
    <div class="stagewrap" id="stage"></div>
    <aside class="ctx" id="ctx"><div class="ctxIn" id="ctxIn"></div></aside>
  </div>

  <div class="qode">
    <div class="prep" id="prep"></div>
    <div class="qrow">
      <input id="ask" placeholder="원하는 걸 말해보세요." autocomplete="off" spellcheck="false">
      <button class="go" id="go">Qode 실행</button>
    </div>
  </div>

</div>
<script>/*{{JS}}*/</script>
</body>
</html>
