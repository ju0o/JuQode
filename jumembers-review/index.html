<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202922">
<title>JuMembers · 매장 시스템 검토</title>
<style>
:root{--bg:#f5f2eb;--paper:#fff;--ink:#171915;--muted:#72766e;--line:#e4dfd4;--brand:#d84d2f;--dark:#202922;--green:#247149;--greenbg:#eaf5ed;--redbg:#fff0ea;--amber:#91630a;--amberbg:#fff4d7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1040px;margin:auto;padding:16px 14px 96px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand{font-weight:950}.small{font-size:12px;color:var(--muted)}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#ece9e0;font-size:11px;font-weight:850}.ok{background:var(--greenbg);color:var(--green)}.wait{background:var(--amberbg);color:var(--amber)}.no{background:var(--redbg);color:var(--brand)}.progress{height:7px;background:#e8e3d8;border-radius:99px;overflow:hidden;margin-bottom:14px}.progress>div{height:100%;background:var(--brand);transition:.2s}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:9px}.chip{white-space:nowrap;background:#ebe7dd;color:#70736c;padding:7px 9px;border-radius:10px;font-size:11px;font-weight:800}.chip.on{background:var(--dark);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 26px rgba(20,22,18,.04)}.hero{background:linear-gradient(135deg,#202922,#34483d);color:#fff;border:none;padding:34px}.hero h1{font-size:38px;line-height:1.14;margin:8px 0 14px}.hero p{color:#d3dad5;line-height:1.7}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.12em;color:var(--brand);margin:0 0 7px}.hero .eyebrow{color:#ffb09e}h2{font-size:28px;margin:6px 0 8px}.sub{color:var(--muted);line-height:1.6;margin-top:0}.grid{display:grid;gap:12px}.two{grid-template-columns:1.45fr .8fr}.screen{background:#fbfaf6;border:1px solid var(--line);border-radius:20px;overflow:hidden}.screenbar{background:var(--dark);color:#fff;padding:14px 17px;display:flex;justify-content:space-between;gap:8px}.body{padding:16px}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.menuitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.menuitem h3{font-size:15px;margin:0 0 4px}.muted{color:var(--muted)}.qty{display:flex;gap:7px;align-items:center;margin-top:10px}.qty button{width:31px;height:31px;border:0;border-radius:9px;background:#eeebe3;font-weight:950}.total{margin-top:12px;background:var(--dark);color:#fff;border-radius:13px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 12px;font-weight:850}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}.btn.full{width:100%}.explain{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.explain h3{margin:10px 0}.explain p,.explain li{color:var(--muted);font-size:14px;line-height:1.6}.review{margin-top:12px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.choice{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font-weight:850}.choice.active.okc{background:var(--greenbg);border-color:#b6dcc1;color:var(--green)}.choice.active.chgc{background:var(--redbg);border-color:#e9baad;color:var(--brand)}.choice.active.unsurec{background:var(--amberbg);border-color:#dfcb90;color:var(--amber)}.field{display:grid;gap:6px;margin-top:11px}.field label{font-size:12px;font-weight:850}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;outline:none}.field textarea{min-height:82px;resize:vertical}.ticket{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.tickethead{display:flex;justify-content:space-between;gap:12px}.items{font-size:13px;line-height:1.7;margin-top:8px}.actions{display:flex;gap:7px;margin-top:10px}.success,.notice,.warn{padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.55}.success{background:var(--greenbg);color:#245f3d}.notice{background:#edf5fa;color:#345e75}.warn{background:var(--amberbg);color:#79560d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.stat strong{display:block;font-size:20px;margin-top:3px}.features{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.feature{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.feature input{margin-top:3px;accent-color:var(--brand)}.summary{white-space:pre-wrap;background:#1e251f;color:#edf1ee;border-radius:14px;padding:14px;font:12px/1.55 ui-monospace,monospace}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px;backdrop-filter:blur(12px)}.navin{max-width:1040px;margin:auto;display:flex;justify-content:space-between;gap:10px}.nav .btn{min-width:120px}.hidden{display:none!important}.center{text-align:center;padding:38px 12px}.check{width:64px;height:64px;margin:0 auto 15px;border-radius:50%;display:grid;place-items:center;background:var(--greenbg);color:var(--green);font-size:30px;font-weight:950}
@media(max-width:760px){.wrap{padding:10px 9px 90px}.hero{padding:26px 20px}.hero h1{font-size:30px}.two,.menu,.stats,.features,.choices{grid-template-columns:1fr}.card{padding:16px}h2{font-size:24px}.nav .btn{flex:1;min-width:0}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(()=>{
const API='https://dkfgldzwsmnqucdudkoj.supabase.co/functions/v1/submit-client-review';
const root=document.getElementById('root');
const menu={pork:{name:'삼겹살 1인분',price:15000,qty:0},stew:{name:'된장찌개',price:4000,qty:0},buffet:{name:'한식뷔페 이용권',price:12000,qty:0}};
const s={step:0,order:null,orderStatus:'NONE',rejectReason:'',memberFound:false,pointsBefore:5420,pointsUsed:0,payment:false,ownerPrice:15000,soldOut:false,reviews:{table_order:{choice:'',detail:''},kds:{choice:'',detail:''},member:{choice:'',detail:''},owner:{choice:'',detail:''}},features:[]};
const steps=['안내','테이블 주문','주문 확인','회원·계산','대표 관리','선택/피드백','완료'];
const fmt=n=>Math.max(0,Math.round(Number(n)||0)).toLocaleString('ko-KR');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cart=()=>Object.values(menu).reduce((a,m)=>a+m.price*m.qty,0);
const bill=()=>s.orderStatus==='ACCEPTED'&&s.order?s.order.total:34000;
const items=()=>Object.values(menu).filter(m=>m.qty>0).map(m=>({name:m.name,qty:m.qty,price:m.price,lineTotal:m.qty*m.price}));
function shell(inner){let p=(s.step+1)/steps.length*100;return `<div class="wrap"><div class="top"><div><div class="brand">JuMembers · 매장 시스템 검토</div><div class="small">검토본 R1 · 설치 없이 휴대폰/PC에서 확인</div></div><span class="badge">예시 데이터</span></div><div class="chips">${steps.map((x,i)=>`<span class="chip ${i===s.step?'on':''}">${i+1}. ${x}</span>`).join('')}</div><div class="progress"><div style="width:${p}%"></div></div>${inner}</div>${s.step<6?`<div class="nav"><div class="navin"><button class="btn" id="prev" ${s.step===0?'disabled':''}>이전</button><button class="btn primary" id="next">${s.step===5?'제출 화면':'다음'}</button></div></div>`:''}`}
function feedback(key,title){let r=s.reviews[key];return `<div class="card review"><b>${title}</b><div class="choices">${[['ok','이대로 좋음','okc'],['change','수정 필요','chgc'],['unsure','잘 모르겠음','unsurec']].map(([v,l,c])=>`<button class="choice ${r.choice===v?'active '+c:''}" data-fb="${key}" data-v="${v}">${l}</button>`).join('')}</div>${r.choice==='change'?`<div class="field"><label>어떻게 수정하면 좋을까요?</label><textarea data-detail="${key}" placeholder="예: 주문 버튼을 더 크게 보여주세요.">${esc(r.detail)}</textarea></div>`:''}</div>`}
function intro(){return shell(`<div class="card hero"><p class="eyebrow">안녕하세요</p><h1>실제로 사용하실 모습을<br>차례대로 보여드릴게요.</h1><p>전문 용어는 보지 않으셔도 됩니다. 손님 주문 → 직원 확인 → 계산과 포인트 → 대표 관리까지 직접 눌러보시고, 각 화면마다 의견만 선택해주세요.</p><div class="notice" style="background:rgba(255,255,255,.1);color:#fff;margin-top:18px">① 화면을 직접 눌러봅니다 → ② 이대로 좋은지 고릅니다 → ③ 마지막에 추가 의견을 제출합니다.</div></div>`)}
function table(){return shell(`<p class="eyebrow">예시 1 · 손님</p><h2>12번 테이블에서 주문합니다.</h2><p class="sub">메뉴 수량을 바꾸고 실제로 “주문 요청”을 눌러보세요.</p><div class="grid two"><div class="screen"><div class="screenbar"><b>TABLE 12</b><span>메뉴 주문</span></div><div class="body"><div class="menu">${Object.entries(menu).map(([k,m])=>`<div class="menuitem"><h3>${m.name}</h3><div class="muted">${fmt(m.price)}원</div><div class="qty"><button data-q="${k}" data-d="-1">−</button><b>${m.qty}</b><button data-q="${k}" data-d="1">+</button></div></div>`).join('')}</div><div class="total"><div><small>이번 주문</small><br><b>${fmt(cart())}원</b></div><button class="btn primary" id="order">주문 요청</button></div>${s.order?`<div class="success" style="margin-top:10px">주문 #${s.order.code}이 직원 화면으로 전달되었습니다.</div>`:''}</div></div><div class="explain"><span class="badge ok">손님 화면</span><h3>필요한 것만 보여줍니다.</h3><ul><li>메뉴·가격</li><li>수량</li><li>이번 주문금액</li><li>주문 요청</li></ul><p>실제 운영 시 사진·옵션·품절 표시도 추가할 수 있습니다.</p></div></div>${feedback('table_order','손님 주문 화면은 어떠신가요?')}`)}
function kds(){let o=s.order||{code:'DEMO-1201',items:[{name:'삼겹살 1인분',qty:2},{name:'된장찌개',qty:1}],total:34000};return shell(`<p class="eyebrow">예시 2 · 직원</p><h2>주문이 바/주방 태블릿에 도착합니다.</h2><p class="sub">직원은 주문을 승인하거나, 어렵다면 이유를 선택해 거절합니다.</p><div class="grid two"><div class="screen"><div class="screenbar"><b>신규 주문</b><span class="badge wait">TABLE 12</span></div><div class="body"><div class="ticket"><div class="tickethead"><div><b>#${o.code}</b><div class="muted">방금 전</div></div><b>${fmt(o.total)}원</b></div><div class="items">${o.items.map(x=>`${x.name} × ${x.qty}`).join('<br>')}</div><div class="actions"><button class="btn primary" id="approve">승인</button><button class="btn" id="reject">거절</button></div><div id="rbox" class="field ${s.orderStatus==='REJECTING'?'':'hidden'}"><label>거절 사유</label><select id="reason"><option>재료 소진</option><option>주문 마감</option><option>기타</option></select><button class="btn dark" id="confirmReject">사유 보내기</button></div></div>${s.orderStatus==='ACCEPTED'?`<div class="success" style="margin-top:10px"><b>승인 완료</b><br>손님 화면과 계산서에 반영됩니다.</div>`:''}${s.orderStatus==='REJECTED'?`<div class="warn" style="margin-top:10px"><b>거절 안내 전송</b><br>${esc(s.rejectReason)}</div>`:''}</div></div><div class="explain"><span class="badge ok">승인</span><p>계산서에 자동 추가되고 대표 현황에도 반영됩니다.</p><span class="badge no">거절</span><p>선택한 사유가 손님 태블릿에 표시됩니다.</p></div></div>${feedback('kds','승인/거절 방식은 어떠신가요?')}`)}
function member(){let b=bill(),use=Math.min(Number(s.pointsUsed)||0,s.pointsBefore,b),final=b-use,earn=Math.floor(final*.03),after=s.payment?s.pointsBefore-use+earn:s.pointsBefore;return shell(`<p class="eyebrow">예시 3 · 카운터</p><h2>회원 조회와 포인트를 처리합니다.</h2><p class="sub">휴대폰 번호로 회원을 찾고 포인트 사용 후 결제해보세요.</p><div class="grid two"><div class="screen"><div class="screenbar"><b>회원 조회 / 계산</b><span>TABLE 12</span></div><div class="body"><div class="field"><label>휴대폰 번호</label><input id="phone" value="010-1234-5678"><button class="btn primary" id="lookup">회원 조회</button></div>${s.memberFound?`<div class="ticket" style="margin-top:10px"><div class="tickethead"><div><b>황주영</b><div class="muted">최근방문 1일 전 · 총 12회</div></div><b>${fmt(after)} P</b></div></div>`:''}<div class="ticket" style="margin-top:10px"><div class="tickethead"><b>TABLE 12 계산서</b><b>${fmt(b)}원</b></div><div class="field"><label>포인트 사용</label><input id="usep" type="number" min="0" max="5420" step="100" value="${s.pointsUsed}"></div><p>최종 결제액 <b>${fmt(final)}원</b></p><p>예상 적립 <b>${fmt(earn)}P</b></p><button class="btn dark full" id="pay">결제 완료</button></div>${s.payment?`<div class="success" style="margin-top:10px">${fmt(use)}P 사용 · ${fmt(earn)}P 적립 · 새 잔액 ${fmt(after)}P</div>`:''}</div></div><div class="explain"><span class="badge ok">회원/포인트</span><p>적립·사용·환불 내역을 기록으로 남겨 계산이 꼬이지 않도록 하는 방향입니다.</p></div></div>${feedback('member','회원/포인트 방식은 어떠신가요?')}`)}
function owner(){return shell(`<p class="eyebrow">예시 4 · 대표</p><h2>대표님은 휴대폰에서도 확인합니다.</h2><p class="sub">오늘 현황을 보고 메뉴 가격/품절을 전체 태블릿에 반영하는 예시입니다.</p><div class="grid two"><div class="screen"><div class="screenbar"><b>오늘 매장 현황</b><span class="badge ok">기기 정상</span></div><div class="body"><div class="stats"><div class="stat"><small>현재 주문</small><strong>${s.orderStatus==='ACCEPTED'?8:7}건</strong></div><div class="stat"><small>사용 테이블</small><strong>18/25</strong></div><div class="stat"><small>오늘 매출</small><strong>128만</strong></div><div class="stat"><small>신규회원</small><strong>23명</strong></div></div><div class="ticket" style="margin-top:12px"><b>삼겹살 1인분</b><div class="field"><label>가격</label><input id="oprice" type="number" value="${s.ownerPrice}"></div><label class="feature" style="margin-top:9px"><input id="sold" type="checkbox" ${s.soldOut?'checked':''}><span><b>품절로 표시</b><div class="small">주문 태블릿 25대에서 주문 불가 표시</div></span></label><button class="btn primary full" id="publish" style="margin-top:9px">전체 기기에 반영</button></div></div></div><div class="explain"><span class="badge">대표 화면</span><p>대표 휴대폰이나 PC에서 메뉴 수정, 주문 현황, 회원 현황, 기기 상태를 확인하는 방향입니다.</p></div></div>${feedback('owner','대표 관리 화면은 어떠신가요?')}`)}
function finalStep(){let defs=[['직원 호출','물·불판·직원 요청'],['주문서 프린터','주방/바 자동 출력'],['영수증 프린터','계산 후 출력'],['쿠폰','회원 혜택'],['외국어 메뉴','영/일/중 메뉴'],['테이블 이동','계산서 함께 이동'],['AI 오늘 요약','대표용 일일 분석'],['AI 수요 예측','내일 준비량 보조']];return shell(`<p class="eyebrow">마지막</p><h2>필요한 기능과 의견을 알려주세요.</h2><div class="features">${defs.map(([a,b])=>`<label class="feature"><input class="feat" type="checkbox" value="${a}" ${s.features.includes(a)?'checked':''}><span><b>${a}</b><div class="small">${b}</div></span></label>`).join('')}</div><div class="card" style="margin-top:12px"><div class="field"><label>매장명 *</label><input id="store" placeholder="예: 삼겹세상"></div><div class="field"><label>대표/담당자 성함 *</label><input id="contact" placeholder="성함"></div><div class="field"><label>연락처</label><input id="tel" placeholder="선택 입력"></div><div class="field"><label>전체적으로 어떻게 진행하면 좋을까요? *</label><select id="decision"><option value="">선택해주세요</option><option value="GO">이대로 진행</option><option value="CHANGE">수정 후 다시 확인</option><option value="NEED_EXPLANATION">조금 더 설명 필요</option></select></div><div class="field"><label>그 외 필요한 기능</label><textarea id="other"></textarea></div><div class="field"><label>가장 먼저 수정했으면 하는 부분</label><textarea id="priority"></textarea></div><div class="field"><label>기타 의견</label><textarea id="memo"></textarea></div><label class="feature" style="margin-top:11px"><input id="consent" type="checkbox"><span><b>검토 내용 전송에 동의합니다. *</b><div class="small">작성한 의견과 시뮬레이션 결과가 프로젝트 검토용으로 저장됩니다.</div></span></label><button class="btn primary full" id="submit" style="margin-top:12px">검토 내용 제출</button><div id="sendmsg" class="notice hidden" style="margin-top:10px"></div></div>`)}
function done(){return shell(`<div class="card center"><div class="check">✓</div><h2>검토 내용이 전송되었습니다.</h2><p class="sub">검토번호 <b>${esc(s.receipt?.review_code||'')}</b><br>수정 의견을 확인한 뒤 필요하면 반영한 새 검토본을 다시 보내드리겠습니다.</p></div>`)}
function render(){root.innerHTML=s.step===0?intro():s.step===1?table():s.step===2?kds():s.step===3?member():s.step===4?owner():s.step===5?finalStep():done();bind()}
function bind(){document.getElementById('prev')?.addEventListener('click',()=>{if(s.step>0){s.step--;render()}});document.getElementById('next')?.addEventListener('click',()=>{if(s.step<5){s.step++;render()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let k=b.dataset.q,d=Number(b.dataset.d);menu[k].qty=Math.max(0,menu[k].qty+d);render()});document.getElementById('order')?.addEventListener('click',()=>{if(cart()<=0){alert('메뉴를 먼저 담아주세요.');return}s.order={code:'T12-'+String(Date.now()).slice(-5),items:items(),total:cart()};s.orderStatus='PENDING';render()});document.getElementById('approve')?.addEventListener('click',()=>{s.orderStatus='ACCEPTED';render()});document.getElementById('reject')?.addEventListener('click',()=>{s.orderStatus='REJECTING';render()});document.getElementById('confirmReject')?.addEventListener('click',()=>{s.rejectReason=document.getElementById('reason').value;s.orderStatus='REJECTED';render()});document.getElementById('lookup')?.addEventListener('click',()=>{s.memberFound=true;render()});document.getElementById('usep')?.addEventListener('input',e=>{s.pointsUsed=Number(e.target.value)||0;render()});document.getElementById('pay')?.addEventListener('click',()=>{s.payment=true;render()});document.getElementById('publish')?.addEventListener('click',()=>{s.ownerPrice=Number(document.getElementById('oprice').value)||15000;s.soldOut=document.getElementById('sold').checked;alert('예시: 전체 주문 태블릿에 반영되었습니다.');render()});document.querySelectorAll('[data-fb]').forEach(b=>b.onclick=()=>{let k=b.dataset.fb;s.reviews[k].choice=b.dataset.v;render()});document.querySelectorAll('[data-detail]').forEach(t=>t.oninput=()=>{s.reviews[t.dataset.detail].detail=t.value});document.querySelectorAll('.feat').forEach(c=>c.onchange=()=>{s.features=[...document.querySelectorAll('.feat:checked')].map(x=>x.value)});document.getElementById('submit')?.addEventListener('click',submit)}
async function submit(){let store=document.getElementById('store').value.trim(),contact=document.getElementById('contact').value.trim(),decision=document.getElementById('decision').value,consent=document.getElementById('consent').checked,msg=document.getElementById('sendmsg');if(!store||!contact||!decision||!consent){msg.classList.remove('hidden');msg.textContent='매장명, 담당자, 전체 진행 방향, 전송 동의를 확인해주세요.';return}let use=Math.min(s.pointsUsed,s.pointsBefore,bill()),earn=Math.floor((bill()-use)*.03);let payload={reviewVersion:'R1',storeName:store,contactName:contact,contactPhone:document.getElementById('tel').value.trim(),overallDecision:decision,selectedFeatures:s.features,otherFeature:document.getElementById('other').value,priorityFeedback:document.getElementById('priority').value,finalMemo:document.getElementById('memo').value,screenReviews:s.reviews,simulationState:{order:s.order,orderStatus:s.orderStatus,rejectReason:s.rejectReason,billTotal:bill(),pointsUsed:use,memberPointsBefore:s.pointsBefore,memberPointsAfter:s.payment?s.pointsBefore-use+earn:s.pointsBefore,ownerMenuPrice:s.ownerPrice,ownerMenuSoldOut:s.soldOut},consent:true};let btn=document.getElementById('submit');btn.disabled=true;btn.textContent='전송 중...';try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok)throw new Error(j.error||'submit_failed');s.receipt=j;s.step=6;render()}catch(e){btn.disabled=false;btn.textContent='검토 내용 제출';msg.classList.remove('hidden');msg.textContent='전송 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.'}}
render();
})();
</script>
</body>
</html>
