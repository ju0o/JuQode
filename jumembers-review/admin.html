<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202922">
<title>JuMembers Review Admin</title>
<style>
:root{--bg:#f4f1e9;--p:#fff;--i:#171915;--m:#75786f;--l:#e4dfd4;--d:#202922;--r:#d84d2f;--g:#247149;--gb:#eaf5ed;--rb:#fff0ea;--ab:#fff4d7;--a:#91630a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif}button,input,select{font:inherit}.wrap{max-width:1080px;margin:auto;padding:18px 14px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:950}.muted{color:var(--m)}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;margin-top:13px}.btn{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px 12px;font-weight:850;cursor:pointer}.primary{background:var(--d);border-color:var(--d);color:#fff}.login{max-width:430px;margin:70px auto}.field{display:grid;gap:6px;margin-top:10px}.field input,.field select{border:1px solid var(--l);border-radius:10px;padding:11px;width:100%}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:#fff;border:1px solid var(--l);border-radius:13px;padding:12px}.stat small{color:var(--m)}.stat strong{display:block;font-size:22px;margin-top:3px}.badge{display:inline-flex;padding:5px 8px;border-radius:99px;background:#eeeae1;font-size:11px;font-weight:850}.ok{background:var(--gb);color:var(--g)}.no{background:var(--rb);color:var(--r)}.wait{background:var(--ab);color:var(--a)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #eee9df;text-align:left;vertical-align:top}.link{color:#b64128;font-weight:850;cursor:pointer}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.box{border:1px solid var(--l);border-radius:13px;padding:12px;margin-top:9px}.pre{white-space:pre-wrap;background:#1e251f;color:#eef1ef;border-radius:12px;padding:13px;font:12px/1.55 ui-monospace,monospace}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}@media(max-width:760px){.wrap{padding:10px}.kpis,.two{grid-template-columns:1fr}table{font-size:12px}.hide-mobile{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
const API='https://dkfgldzwsmnqucdudkoj.supabase.co/functions/v1/client-review-admin-cors';
const app=document.getElementById('app');
let pass=sessionStorage.getItem('jmr_admin_pass')||'',rows=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=x=>x?new Date(x).toLocaleString('ko-KR'):'-';
const labels={ok:'이대로 좋음',change:'수정 필요',unsure:'잘 모르겠음'};
async function api(action,data={}){let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({adminPass:pass,action,...data})});let j=await r.json().catch(()=>({}));if(r.status===401)throw new Error('unauthorized');if(!r.ok)throw new Error(j.error||'request_failed');return j}
function shell(body,logout=true){app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">JuMembers Review Admin</div><div class="muted" style="font-size:12px">고객 피드백 검토함</div></div>${logout?'<button class="btn" id="logout">로그아웃</button>':''}</div>${body}</div>`;document.getElementById('logout')?.addEventListener('click',()=>{sessionStorage.removeItem('jmr_admin_pass');pass='';login()})}
function login(msg=''){shell(`<div class="card login"><h2>관리자 로그인</h2><p class="muted">고객 피드백 관리자 비밀번호를 입력하세요.</p><div class="field"><label>비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div><button id="go" class="btn primary" style="width:100%;margin-top:11px">검토함 열기</button><div id="msg" class="muted" style="margin-top:9px">${esc(msg)}</div></div>`,false);document.getElementById('go').onclick=async()=>{pass=document.getElementById('pw').value;try{await api('list');sessionStorage.setItem('jmr_admin_pass',pass);load()}catch(e){login('비밀번호를 확인하세요.')}}}
function kpis(){return `<div class="kpis"><div class="stat"><small>전체</small><strong>${rows.length}</strong></div><div class="stat"><small>NEW</small><strong>${rows.filter(x=>x.status==='NEW').length}</strong></div><div class="stat"><small>수정 필요</small><strong>${rows.filter(x=>x.overall_decision==='수정 후 다시 확인').length}</strong></div><div class="stat"><small>승인</small><strong>${rows.filter(x=>x.status==='APPROVED').length}</strong></div></div>`}
async function load(){try{rows=(await api('list')).rows||[]}catch(e){return login('세션이 만료되었습니다.')}shell(`<h2 style="margin-top:20px">고객 검토함</h2>${kpis()}<div class="card" style="overflow:auto"><table><thead><tr><th>검토번호</th><th>매장</th><th>담당자</th><th>전체 판단</th><th>상태</th><th class="hide-mobile">제출</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><span class="link" data-id="${r.id}">${esc(r.review_code)}</span></td><td>${esc(r.store_name)}</td><td>${esc(r.contact_name)}</td><td><span class="badge ${r.overall_decision==='이대로 진행'?'ok':r.overall_decision==='수정 후 다시 확인'?'no':'wait'}">${esc(r.overall_decision)}</span></td><td>${esc(r.status)}</td><td class="hide-mobile">${dt(r.created_at)}</td></tr>`).join(''):'<tr><td colspan="6">아직 제출된 피드백이 없습니다.</td></tr>'}</tbody></table></div>`);document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>detail(x.dataset.id))}
function figmaSummary(r){let nm={table_order:'테이블 주문',kds:'주문 확인/KDS',member:'회원/포인트',owner:'대표 관리'},out=[`[${r.review_code}] ${r.store_name} Figma 수정 전달`,`전체 판단: ${r.overall_decision}`];Object.entries(r.screen_reviews||{}).forEach(([k,v])=>{if(v?.choice==='change'||v?.choice==='unsure')out.push(`- ${nm[k]||k}: ${labels[v.choice]||v.choice}${v.detail?' / '+v.detail:''}`)});if(r.other_feature)out.push('- 추가 기능: '+r.other_feature);if(r.priority_feedback)out.push('- 우선 수정: '+r.priority_feedback);if(r.final_memo)out.push('- 기타: '+r.final_memo);return out.join('\n')}
async function detail(id){let r;try{r=(await api('detail',{id})).row}catch(e){alert('불러오지 못했습니다.');return load()}let sr=r.screen_reviews||{},sim=r.simulation_state||{},nm={table_order:'테이블 주문',kds:'주문 확인/KDS',member:'회원/포인트',owner:'대표 관리'},summary=figmaSummary(r);shell(`<button class="btn" id="back">← 검토함</button><div class="two"><div class="card"><h2>${esc(r.review_code)}</h2><p><b>${esc(r.store_name)}</b> · ${esc(r.contact_name)}</p><p><b>전체 판단:</b> ${esc(r.overall_decision)}</p><h3>화면별 의견</h3>${Object.entries(sr).map(([k,v])=>`<div class="box"><b>${esc(nm[k]||k)}</b> · <span class="badge ${v.choice==='ok'?'ok':v.choice==='change'?'no':'wait'}">${esc(labels[v.choice]||v.choice||'미선택')}</span><div class="muted" style="margin-top:5px">${esc(v.detail||'추가 의견 없음')}</div></div>`).join('')}<div class="box"><b>선택 기능</b><div class="muted" style="margin-top:5px">${esc((r.selected_features||[]).join(', ')||'없음')}</div></div><div class="box"><b>우선 수정</b><div class="muted" style="margin-top:5px">${esc(r.priority_feedback||'-')}</div></div><div class="box"><b>기타 의견</b><div class="muted" style="margin-top:5px">${esc(r.final_memo||'-')}</div></div></div><div class="card"><h3>실제 시뮬레이션</h3><p>주문 상태 <b>${esc(sim.orderStatus||'-')}</b></p><p>계산서 <b>${Number(sim.billTotal||0).toLocaleString()}원</b></p><p>포인트 사용 <b>${Number(sim.pointsUsed||0).toLocaleString()}P</b></p><p>메뉴 가격 <b>${Number(sim.ownerMenuPrice||0).toLocaleString()}원</b></p><div class="field"><label>내부 상태</label><select id="status">${['NEW','REVIEWED','FIGMA_UPDATE_NEEDED','APPROVED'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn primary" id="save" style="width:100%;margin-top:9px">상태 저장</button><div class="actions"><button class="btn" id="copy">Figma 수정 요약 복사</button></div><div class="pre">${esc(summary)}</div></div></div>`);document.getElementById('back').onclick=load;document.getElementById('save').onclick=async()=>{try{await api('update',{id:r.id,status:document.getElementById('status').value});alert('저장했습니다.');detail(r.id)}catch(e){alert('저장 실패')}};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(summary);alert('복사했습니다.')}}
if(pass)load();else login();
})();
</script>
</body>
</html>
