<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1240">
<title>JuQode — Software Physics · Visual Grammar</title>
<style>
:root{
  --paper:#F7F5F2; --surface:#FFFFFF; --sunk:#EDEAE5;
  --ink:#0D0C0B; --ink2:#4A4641; --ink3:#857F77; --ink4:#B5AEA5;
  --hair:#D8D3CC; --attn:#9A5B12; --fail:#8C2B20; --past:#5B6B84;
  --sans:"Archivo","Noto Sans KR","Helvetica Neue","Malgun Gothic",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;min-width:1240px}
.wrap{max-width:1280px;margin:0 auto;padding:52px 44px 120px}
.head{border-bottom:2px solid var(--ink);padding-bottom:22px}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink3)}
h1{font-size:46px;font-weight:700;letter-spacing:-.042em;line-height:1;margin:14px 0 0}
.sub{font-size:16.5px;color:var(--ink2);letter-spacing:-.015em;margin-top:14px;line-height:1.65;max-width:920px}
.sub b{font-weight:700;color:var(--ink)}
.meta{display:flex;gap:24px;margin-top:18px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.13em;color:var(--ink3);flex-wrap:wrap}
.kill{border:2px solid var(--ink);background:var(--surface);padding:18px 22px;margin-top:26px;
  display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center}
.kill .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--fail)}
.kill .l b{display:block;font-family:var(--sans);font-size:19px;font-weight:700;
  letter-spacing:-.03em;color:var(--ink);margin-top:8px}
.kill .r{font-size:13.5px;color:var(--ink2);line-height:1.75}
.kill .r b{color:var(--ink)}
section{margin-top:64px}
h2{font-size:11.5px;font-family:var(--mono);letter-spacing:.2em;color:var(--ink3);font-weight:500;
  border-top:1px solid var(--hair);padding-top:12px;margin:0 0 6px}
h3{font-size:27px;font-weight:700;letter-spacing:-.032em;margin:0 0 8px}
.lede{font-size:14.5px;color:var(--ink2);line-height:1.7;max-width:900px;margin:0 0 28px}
.lede b{color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.panel{background:var(--surface);border:1px solid var(--hair)}
.panel.hero{border:2px solid var(--ink)}
.panel svg{display:block;width:100%;height:auto}
.cap{border-top:1px solid var(--hair);padding:14px 18px 16px}
.cap .n{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink3)}
.cap .t{font-size:17px;font-weight:700;letter-spacing:-.025em;margin-top:5px}
.cap .d{font-size:13px;color:var(--ink2);line-height:1.68;margin-top:9px}
.cap .x{font-size:11.5px;color:var(--ink4);line-height:1.62;margin-top:8px}
.cap.sm .t{font-size:14px}
.cap.sm .d{font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
th{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--ink3);font-weight:500;
  text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid var(--ink)}
td{padding:9px 14px 9px 0;border-bottom:1px solid var(--hair);color:var(--ink2);vertical-align:top}
td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
td.no{color:var(--fail)}
td.own{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink);white-space:nowrap}
.gate{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13.5px;align-items:baseline}
.gate i{width:9px;height:9px;background:var(--ink);flex:none;display:block;position:relative;top:1px}
.gate b{font-weight:600;letter-spacing:-.01em}
.gate span{color:var(--ink2);font-size:12.5px}
.foot{border-top:2px solid var(--ink);padding-top:18px;margin-top:70px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--ink3);
  display:flex;justify-content:space-between}
#boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:40px;z-index:99}
</style>
</head>
<body>
<div id="boot">
  <div style="font-weight:700;font-size:19px">보드가 아직 그려지지 않았습니다</div>
  <div style="color:#4A4641;font-size:14px;line-height:1.7">이 파일은 하나로 완결되어 있어 인터넷도 서버도 필요하지 않습니다.</div>
  <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#857F77">software-physics-visual-grammar · self-contained</div>
</div>
<div class="wrap" id="wrap"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   JuQode Phase 3R.3 — Visual Grammar Board
   상위 SSOT: SOFTWARE_PHYSICS_CANON.md (3R.2)

   3R.1 대비 결정적 변경 — 밀도를 점밭(stipple)이 아니라 분할(subdivision)로
   표현한다. Founder 판정: "점들이 쫙 나열된 느낌". 그 판단이 옳았다.
   형태는 이제 연속 공간이 나뉘는 방식에서 나온다.

   외부 의존성 0 · 웹폰트 0 · 난수 0 (재렌더 시 공간 기억 보존)
   ══════════════════════════════════════════════════════════════════════ */

var T={paper:"#F7F5F2",surface:"#FFFFFF",sunk:"#EDEAE5",ink:"#0D0C0B",ink2:"#4A4641",
       ink3:"#857F77",ink4:"#B5AEA5",hair:"#D8D3CC",attn:"#9A5B12",fail:"#8C2B20",past:"#5B6B84"};
var SANS='Archivo,"Noto Sans KR","Malgun Gothic",Arial,sans-serif';
var MONO='"IBM Plex Mono",ui-monospace,Menlo,monospace';
var FLOOR=0.06;

function f(n){return Math.round(n*10)/10}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

/* ── MASS LAYOUT (3R.1에서 유지. 검증된 엔진) ────────────────────── */
function split(masses,total){
  var sum=masses.reduce(function(a,b){return a+b},0);
  var w=masses.map(function(m){return FLOOR+(1-FLOOR)*(sum?m/sum:0)});
  var W=w.reduce(function(a,b){return a+b},0), acc=0;
  return w.map(function(x){var s=total*x/W,o={start:acc,size:s};acc+=s;return o});
}

/* ── SUBDIVISION — 점밭을 대체하는 밀도 표현 ──────────────────────
   가장 큰 칸을 골라 긴 변을 자른다. 난수 없음 → 같은 입력, 같은 그림.
   질량이 크면 더 잘게 나뉜다. 표식을 뿌리지 않는다. */
var RATIOS=[.58,.44,.62,.48,.55,.41,.60,.47,.53,.45];
function cellCount(n){return n<=1?1:n<=4?2:n<=12?3:n<=28?4:5}
function subdivide(r,n,seed){
  var k=cellCount(n), list=[{x:r.x,y:r.y,w:r.w,h:r.h}], lines=[], ri=seed%RATIOS.length;
  var guard=0, first=true;
  while(list.length<k && guard++<40){
    var bi=0;
    for(var i=1;i<list.length;i++) if(list[i].w*list[i].h>list[bi].w*list[bi].h) bi=i;
    var c=list.splice(bi,1)[0], t=RATIOS[ri%RATIOS.length];
    if(c.w<26||c.h<26){list.push(c);break}
    var vert;
    if(first&&c.h>=40){vert=false}                       /* 첫 분할은 층을 만든다 */
    else if(c.w/c.h>1.5){vert=true}
    else if(c.h/c.w>1.5){vert=false}
    else{vert=(ri%2===0)}
    first=false; ri++;
    if(vert){
      var x=c.x+c.w*t; lines.push([x,c.y,x,c.y+c.h]);
      list.push({x:c.x,y:c.y,w:c.w*t,h:c.h},{x:x,y:c.y,w:c.w*(1-t),h:c.h});
    }else{
      var y=c.y+c.h*t; lines.push([c.x,y,c.x+c.w,y]);
      list.push({x:c.x,y:c.y,w:c.w,h:c.h*t},{x:c.x,y:y,w:c.w,h:c.h*(1-t)});
    }
  }
  return {lines:lines,cells:list};
}

/* ── 배치 ─────────────────────────────────────────────────────────── */
function layout(b,box){
  var rows=split(b.bands.map(function(x){
    return x.lanes.reduce(function(a,l){return a+l.mass},0)}),box.h);
  b.bands.forEach(function(bd,i){
    bd._y=box.y+rows[i].start; bd._h=rows[i].size;
    bd._m=bd.lanes.reduce(function(a,l){return a+l.mass},0);
    var cols=split(bd.lanes.map(function(l){return l.mass}),box.w);
    bd.lanes.forEach(function(l,j){l._x=box.x+cols[j].start;l._w=cols[j].size});
  });
  b._box=box; return b;
}
function band(b,id){for(var i=0;i<b.bands.length;i++)if(b.bands[i].id===id)return b.bands[i];return b.bands[0]}
function pt(b,a){var d=band(b,a[0]);return{x:b._box.x+a[1]*b._box.w,y:d._y+a[2]*d._h}}

/* ── PATH — 직교. bezier 금지. 화살촉 금지. ─────────────────────── */
function ortho(b,pts){
  var d="",p=null;
  pts.forEach(function(q,i){
    var v=pt(b,q);
    if(i===0)d="M"+f(v.x)+" "+f(v.y);
    else if(Math.abs(v.x-p.x)<.6||Math.abs(v.y-p.y)<.6)d+=" L"+f(v.x)+" "+f(v.y);
    else if(q[3]==="v")d+=" L"+f(p.x)+" "+f(v.y)+" L"+f(v.x)+" "+f(v.y);
    else d+=" L"+f(v.x)+" "+f(p.y)+" L"+f(v.x)+" "+f(v.y);
    p=v;
  });
  return d;
}
function txt(x,y,s,size,fam,col,anc,ls,w){
  return '<text x="'+f(x)+'" y="'+f(y)+'" font-family="'+fam+'" font-size="'+size+
    '" fill="'+col+'" text-anchor="'+(anc||"start")+'"'+(ls?' letter-spacing="'+ls+'"':"")+
    (w?' font-weight="'+w+'"':"")+'>'+esc(s)+'</text>';
}
function txtK(x,y,s,size,fam,col,anc,ls,w){
  var wd=String(s).length*(size*.74)+10, ox=anc==="middle"?-wd/2:anc==="end"?-wd:-5;
  return '<rect x="'+f(x+ox)+'" y="'+f(y-size+1)+'" width="'+f(wd)+'" height="'+f(size+5)+
    '" fill="'+T.surface+'"/>'+txt(x,y,s,size,fam,col,anc,ls,w);
}

/* ── PORT — 경계선이 두꺼워지는 마디. 카드가 아니다. ─────────────── */
function portSVG(b,p,labelOnly){
  var bx=b._box, len=20+11*p.weight, stub=13, col=p.cross?T.attn:T.ink, o="", lx,ly,anc="middle",cx,cy;
  if(p.edge==="top"){cx=bx.x+p.at*bx.w;cy=bx.y;
    o+='<line x1="'+f(cx-len/2)+'" y1="'+cy+'" x2="'+f(cx+len/2)+'" y2="'+cy+'" stroke="'+col+'" stroke-width="5"/>'+
       '<line x1="'+f(cx)+'" y1="'+cy+'" x2="'+f(cx)+'" y2="'+(cy-stub)+'" stroke="'+T.ink2+'" stroke-width="1.6"/>';
    lx=cx;ly=cy-stub-7;}
  else if(p.edge==="bottom"){cx=bx.x+p.at*bx.w;cy=bx.y+bx.h;
    o+='<line x1="'+f(cx-len/2)+'" y1="'+cy+'" x2="'+f(cx+len/2)+'" y2="'+cy+'" stroke="'+col+'" stroke-width="5"/>'+
       '<line x1="'+f(cx)+'" y1="'+cy+'" x2="'+f(cx)+'" y2="'+(cy+stub)+'" stroke="'+T.ink2+'" stroke-width="1.6"/>';
    lx=cx;ly=cy+stub+12;}
  else if(p.edge==="right"){cx=bx.x+bx.w;cy=bx.y+p.at*bx.h;
    o+='<line x1="'+cx+'" y1="'+f(cy-len/2)+'" x2="'+cx+'" y2="'+f(cy+len/2)+'" stroke="'+col+'" stroke-width="5"/>'+
       '<line x1="'+cx+'" y1="'+f(cy)+'" x2="'+(cx+stub)+'" y2="'+f(cy)+'" stroke="'+T.ink2+'" stroke-width="1.6"/>';
    lx=cx+stub+6;ly=cy+4;anc="start";}
  else{cx=bx.x;cy=bx.y+p.at*bx.h;
    o+='<line x1="'+cx+'" y1="'+f(cy-len/2)+'" x2="'+cx+'" y2="'+f(cy+len/2)+'" stroke="'+col+'" stroke-width="5"/>'+
       '<line x1="'+cx+'" y1="'+f(cy)+'" x2="'+(cx-stub)+'" y2="'+f(cy)+'" stroke="'+T.ink2+'" stroke-width="1.6"/>';
    lx=cx-stub-6;ly=cy+4;anc="end";}
  if(labelOnly)return p.label?txt(lx,ly,p.label,10.5,SANS,p.cross?T.attn:T.ink3,anc):"";
  return o;
}

/* ── RENDER ───────────────────────────────────────────────────────── */
function render(b,opt){
  opt=opt||{};
  var bx=opt.box, vb=opt.vb, o="";
  layout(b,bx);
  o+='<svg viewBox="0 0 '+vb.w+' '+vb.h+'" xmlns="http://www.w3.org/2000/svg">';
  o+='<rect width="'+vb.w+'" height="'+vb.h+'" fill="'+T.surface+'"/>';
  var empty=b.state==="empty", unknown=b.state==="unknown";

  /* L3 — 지반의 단단함. 교란된 영역만 파인다 */
  (b.tone||[]).forEach(function(t){
    var d=band(b,t.band), x0=bx.x+t.x0*bx.w, x1=bx.x+t.x1*bx.w;
    var y0=d._y+(t.y0||0)*d._h, y1=d._y+(t.y1==null?1:t.y1)*d._h;
    o+='<rect x="'+f(x0)+'" y="'+f(y0)+'" width="'+f(x1-x0)+'" height="'+f(y1-y0)+
       '" fill="'+(t.kind==="fail"?"#F6EDEC":T.sunk)+'"/>';
  });

  /* BOUNDARY */
  o+='<rect x="'+bx.x+'" y="'+bx.y+'" width="'+bx.w+'" height="'+bx.h+'" fill="none" stroke="'+
     (empty?T.ink4:T.ink)+'" stroke-width="'+(empty?1:2)+'"'+(empty?' stroke-dasharray="5 5"':"")+'/>';

  if(!empty){
    /* 층 구분 — 구조의 1차 위계 */
    b.bands.forEach(function(d,i){
      if(i>0)o+='<line x1="'+bx.x+'" y1="'+f(d._y)+'" x2="'+f(bx.x+bx.w)+'" y2="'+f(d._y)+
        '" stroke="'+(unknown?T.ink4:T.hair)+'" stroke-width="'+(unknown?1:2)+'"'+
        (unknown?' stroke-dasharray="7 5"':"")+'/>';
    });
    /* 관심사 구분 — 2차 */
    b.bands.forEach(function(d){
      d.lanes.forEach(function(l,j){
        if(j>0&&d._h>10)o+='<line x1="'+f(l._x)+'" y1="'+f(d._y)+'" x2="'+f(l._x)+'" y2="'+f(d._y+d._h)+
          '" stroke="'+(unknown?T.ink4:T.hair)+'" stroke-width="1"'+
          (unknown?' stroke-dasharray="7 5"':"")+'/>';
      });
    });
    /* 분할 — 3차. 밀도가 여기서 나온다. 점을 뿌리지 않는다 */
    var seed=3;
    b.bands.forEach(function(d){
      d.lanes.forEach(function(l){
        seed+=7;
        if(d._h<24||l._w<24)return;
        if(!unknown&&l.mass<2)return;
        var sub=subdivide({x:l._x,y:d._y,w:l._w,h:d._h},unknown?(l.objects||8):(l.objects||0),seed);
        sub.lines.forEach(function(ln){
          if(unknown){
            /* 미완결 윤곽 — 선이 서로 만나지 않는다 */
            var dx=(ln[2]-ln[0])*.24, dy=(ln[3]-ln[1])*.24;
            o+='<line x1="'+f(ln[0]+dx)+'" y1="'+f(ln[1]+dy)+'" x2="'+f(ln[2]-dx)+'" y2="'+f(ln[3]-dy)+
               '" stroke="'+T.ink4+'" stroke-width="1" stroke-dasharray="5 4"/>';
          }else{
            o+='<line x1="'+f(ln[0])+'" y1="'+f(ln[1])+'" x2="'+f(ln[2])+'" y2="'+f(ln[3])+
               '" stroke="'+T.hair+'" stroke-width="'+(l.unverified?1:0.75)+'"'+
               (l.unverified?' stroke-dasharray="4 3"':"")+'/>';
          }
        });
      });
    });
  }

  /* 원점 — Empty 전용. 첫 번째 약속 */
  if(b.origin){var oc=pt(b,b.origin);
    o+='<rect x="'+f(oc.x-6)+'" y="'+f(oc.y-6)+'" width="12" height="12" fill="'+T.ink+'"/>';}

  /* L2 — 인과. 분할선보다 두껍고 어둡다. 절대 헷갈리지 않는다 */
  (b.paths||[]).forEach(function(p,k){
    var d=ortho(b,p.points);
    var col=p.state==="new"?T.attn:p.state==="fail"?T.fail:T.ink2;
    var w=p.state==="new"?2.6:(p.weight||2.2);
    o+='<path d="'+d+'" fill="none" stroke="'+T.surface+'" stroke-width="'+(w+5.5)+'" stroke-linejoin="miter"/>';
    o+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="miter"'+
       (p.state==="fail"?' stroke-dasharray="4 3"':"")+(p.unverified?' stroke-dasharray="6 4"':"")+
       ' data-mk="'+(p.mark==null?-1:p.mark)+'" id="q'+(opt.uid||"")+"_"+k+'"/>';
  });

  (b.ports||[]).forEach(function(p){o+=portSVG(b,p)});

  (b.marks||[]).forEach(function(m){
    var q=pt(b,m.a), s=m.size||10, c=m.state==="new"?T.attn:m.state==="fail"?T.fail:T.ink;
    o+='<rect x="'+f(q.x-s/2)+'" y="'+f(q.y-s/2)+'" width="'+s+'" height="'+s+'" fill="'+c+'"/>';
  });

  /* TEXT — 예산 강제. 초과분은 말줄임이 아니라 표시 포기 */
  var cand=[];
  function want(pri,svg){cand.push({p:pri,i:cand.length,s:svg})}
  if(b.name)want(100,txtK(bx.x+bx.w-16,bx.y+5,b.name,14,SANS,empty?T.ink3:T.ink,"end","-.02em",700));
  (b.tags||[]).forEach(function(t){var q=pt(b,t.a);
    want(90,txtK(q.x,q.y,t.label,9.5,MONO,t.state==="new"?T.attn:t.state==="fail"?T.fail:T.ink3,t.anchor||"start",".12em"));});
  (b.marks||[]).forEach(function(m){if(!m.label)return;var q=pt(b,m.a);
    want(75,txtK(q.x+(m.size||10)/2+7,q.y+4,m.label,11.5,SANS,
      m.state==="new"?T.attn:m.state==="fail"?T.fail:T.ink2,"start",null,m.state?600:null));});
  (b.ports||[]).forEach(function(p){if(p.label)want(58+2*p.weight,portSVG(b,p,true))});
  b.bands.forEach(function(d){d.lanes.forEach(function(l){
    if(l.label&&l._w>=70&&d._h>=34)
      want(45+l.mass,txtK(f(l._x+l._w/2),f(d._y+d._h-9),l.label,10.5,SANS,T.ink3,"middle",".06em"));});});
  b.bands.forEach(function(d){
    if(d.label&&d._m>0&&d._h>=34)
      want(40+d._m,txt(bx.x-11,f(d._y+d._h/2+4),d.label,10.5,SANS,T.ink3,"end",".1em"));});
  var budget=opt.budget||7;
  var keep=cand.slice().sort(function(a,c){return c.p-a.p||a.i-c.i}).slice(0,budget);
  keep.sort(function(a,c){return a.i-c.i}).forEach(function(c){o+=c.s});
  b._text=keep.length; b._over=cand.length>budget;
  o+='</svg>';
  return o;
}
function marksOn(root){
  root.querySelectorAll('path[data-mk]').forEach(function(p){
    var t=parseFloat(p.getAttribute("data-mk")); if(!(t>=0))return;
    var L; try{L=p.getTotalLength()}catch(e){return} if(!L)return;
    var a=p.getPointAtLength(L*t), c=p.getPointAtLength(Math.min(L,L*t+2));
    var dx=c.x-a.x, dy=c.y-a.y, m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    var nx=-dy, ny=dx, s=7.5;
    var el=document.createElementNS("http://www.w3.org/2000/svg","polygon");
