<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>JuQode — Primary Workspace V02 · Visual Board</title>
<style>
:root{
  --paper:#F7F5F2; --surface:#FFFFFF; --sunk:#EDEAE5;
  --ink:#0D0C0B; --ink2:#4A4641; --ink3:#857F77; --ink4:#B5AEA5;
  --hair:#D8D3CC; --attn:#9A5B12; --fail:#8C2B20; --past:#5B6B84;
  --sans:"Archivo","Noto Sans KR","Helvetica Neue","Malgun Gothic",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;min-width:1280px}
.wrap{max-width:1360px;margin:0 auto;padding:52px 44px 120px}

.head{border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:44px}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink3)}
h1{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:14px 0 0}
.sub{font-size:17px;color:var(--ink2);letter-spacing:-.015em;margin-top:14px;line-height:1.6}
.sub b{font-weight:700;color:var(--ink)}
.meta{display:flex;gap:26px;margin-top:20px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.13em;color:var(--ink3)}

section{margin-bottom:64px}
h2{font-size:12px;font-family:var(--mono);letter-spacing:.2em;color:var(--ink3);font-weight:500;
  border-top:1px solid var(--hair);padding-top:12px;margin:0 0 6px}
h3{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}
.lede{font-size:14.5px;color:var(--ink2);line-height:1.7;max-width:860px;margin:0 0 28px}
.lede b{color:var(--ink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}

.panel{background:var(--surface);border:1px solid var(--hair)}
.panel svg{display:block;width:100%;height:auto}
.cap{border-top:1px solid var(--hair);padding:12px 15px 14px}
.cap .t{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.cap .m{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink3);margin-top:5px}
.cap .d{font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:8px}
.cap .n{font-size:11.5px;color:var(--ink4);line-height:1.6;margin-top:7px}
.small .t{font-size:12.5px}
.small .d{font-size:11.5px}

table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
th{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--ink3);font-weight:500;
  text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--ink)}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--hair);color:var(--ink2);vertical-align:top}
td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
td.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em}

.tokens{display:flex;gap:0;border:1px solid var(--hair);margin-top:24px}
.tokens div{flex:1;height:46px;position:relative}
.tokens span{position:absolute;bottom:-19px;left:0;font-family:var(--mono);font-size:8px;
  letter-spacing:.08em;color:var(--ink3)}

.gate{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13.5px;
  align-items:baseline}
.gate i{width:9px;height:9px;background:var(--ink);flex:none;display:block;position:relative;top:1px}
.gate b{font-weight:600;letter-spacing:-.01em}
.gate span{color:var(--ink2);font-size:12.5px}

.rule{border:2px solid var(--ink);background:var(--surface);padding:20px 24px;margin-top:26px}
.rule .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink3)}
.rule .v{font-size:19px;font-weight:700;letter-spacing:-.025em;margin-top:9px;line-height:1.5}
.rule .x{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.7}

.foot{border-top:2px solid var(--ink);padding-top:18px;margin-top:70px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--ink3);
  display:flex;justify-content:space-between}
#boot{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:40px;z-index:99}
</style>
</head>
<body>
<div id="boot">
  <div style="font-weight:700;font-size:19px">보드가 아직 그려지지 않았습니다</div>
  <div style="color:#4A4641;font-size:14px;line-height:1.7">이 파일은 하나로 완결되어 있어 인터넷도 서버도 필요하지 않습니다.<br>
  브라우저에서 JavaScript 가 꺼져 있으면 이 문장이 남습니다.</div>
  <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#857F77;letter-spacing:.06em">
  JuQode · primary-workspace-v02 · self-contained</div>
</div>
<div class="wrap" id="wrap"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   JuQode Primary Workspace V02 — Visual Board
   이 스크립트는 보드이면서 동시에 MASS LAYOUT 엔진의 참조 구현이다.
   Lovable은 split() / marks() / ortho() 를 그대로 옮겨 쓴다.
   외부 의존성 0. 웹폰트 0. Mermaid 없음.
   출처: docs/design/PRIMARY_WORKSPACE_V02.md
   ═══════════════════════════════════════════════════════════════════ */

var T={paper:"#F7F5F2",surface:"#FFFFFF",sunk:"#EDEAE5",ink:"#0D0C0B",ink2:"#4A4641",
       ink3:"#857F77",ink4:"#B5AEA5",hair:"#D8D3CC",attn:"#9A5B12",fail:"#8C2B20",past:"#5B6B84"};
var SANS='Archivo,"Noto Sans KR","Malgun Gothic",Arial,sans-serif';
var MONO='"IBM Plex Mono",ui-monospace,Menlo,monospace';

var VB={w:420,h:280};
var B ={x:56,y:38,w:288,h:180};        /* Software 몸체. 8:5 근사 */
var FLOOR=0.06, CAP=48;

function f(n){return Math.round(n*10)/10}
function rnd(seed){var s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

/* ── MASS LAYOUT ─────────────────────────────────────────────────────
   질량 → 좌표. 세로(band)와 가로(lane)에 같은 함수를 쓴다.
   FLOOR 덕분에 질량 0인 region 은 사라지지 않고 얇은 선으로 붕괴한다. */
function split(masses,total){
  var sum=masses.reduce(function(a,b){return a+b},0);
  var w=masses.map(function(m){return FLOOR+(1-FLOOR)*(sum?m/sum:0)});
  var W=w.reduce(function(a,b){return a+b},0), acc=0;
  return w.map(function(x){var size=total*x/W,o={start:acc,size:size};acc+=size;return o});
}
function layout(sw,box){
  var bx=box||B;
  var masses=sw.bands.map(function(b){return b.lanes.reduce(function(a,l){return a+l.mass},0)});
  var rows=split(masses,bx.h);
  sw.bands.forEach(function(b,i){
    b._y=bx.y+rows[i].start; b._h=rows[i].size; b._m=masses[i];
    var cols=split(b.lanes.map(function(l){return l.mass}),bx.w);
    b.lanes.forEach(function(l,j){ l._x=bx.x+cols[j].start; l._w=cols[j].size; });
  });
  sw._box=bx;
  return sw;
}
function band(sw,id){for(var i=0;i<sw.bands.length;i++)if(sw.bands[i].id===id)return sw.bands[i];return sw.bands[0]}
function pt(sw,a){var b=band(sw,a[0]);return{x:sw._box.x+a[1]*sw._box.w,y:b._y+a[2]*b._h}}

/* ── DENSITY FIELD ───────────────────────────────────────────────────
   n 개의 의미 객체를 n 개의 라벨로 만들지 않는 장치.
   49개부터는 개수가 아니라 톤(tone)이 된다. */
function markSize(n){return n<=1?9:n<=4?7:n<=12?6:n<=28?5:4}
function marks(n,x,y,w,h,seed,color){
  if(n<=0||h<18||w<18)return"";
  var shown=Math.min(n,CAP), s=markSize(n);   /* CAP 을 넘으면 밭이 포화한다. 잉크는 줄지 않는다 */
  var px=Math.min(14,w*.18), py=Math.min(14,h*.18);
  var iw=w-px*2, ih=h-py*2;
  if(iw<6||ih<6)return"";
  var cols=Math.max(1,Math.round(Math.sqrt(shown*iw/ih)));
  var rows=Math.ceil(shown/cols), cw=iw/cols, ch=ih/rows, r=rnd(seed), out="";
  for(var i=0;i<shown;i++){
    var c=i%cols, rw=Math.floor(i/cols);
    var jx=(r()-.5)*3.2, jy=(r()-.5)*3.2;
    var mx=x+px+c*cw+cw/2-s/2+jx, my=y+py+rw*ch+ch/2-s/2+jy;
    out+='<rect x="'+f(mx)+'" y="'+f(my)+'" width="'+s+'" height="'+s+'" fill="'+(color||T.ink3)+'"/>';
  }
  return out;
}

/* ── PATH ── 직교. bezier 금지. 화살촉 금지. ────────────────────────── */
function ortho(sw,points){
  var d="",prev=null;
  points.forEach(function(p,i){
    var q=pt(sw,p);
    if(i===0){d="M"+f(q.x)+" "+f(q.y)}
    else if(Math.abs(q.x-prev.x)<.6||Math.abs(q.y-prev.y)<.6){d+=" L"+f(q.x)+" "+f(q.y)}
    else if(p[3]==="v"){d+=" L"+f(prev.x)+" "+f(q.y)+" L"+f(q.x)+" "+f(q.y)}
    else{d+=" L"+f(q.x)+" "+f(prev.y)+" L"+f(q.x)+" "+f(q.y)}
    prev=q;
  });
  return d;
}

/* ── PORT ── 떠 있는 연동 카드가 아니다. 경계선이 두꺼워지는 마디다. ── */
function port(sw,p,labelOnly){
  var bx=sw._box, len=18+10*p.weight, stub=12, out="", col=p.state==="changed"?T.attn:T.ink;
  var cx,cy,lx,ly,anc="middle";
  if(p.edge==="top"){
    cx=bx.x+p.at*bx.w; cy=bx.y;
    out+='<line x1="'+f(cx-len/2)+'" y1="'+cy+'" x2="'+f(cx+len/2)+'" y2="'+cy+'" stroke="'+col+'" stroke-width="4.5"/>';
    out+='<line x1="'+f(cx)+'" y1="'+cy+'" x2="'+f(cx)+'" y2="'+(cy-stub)+'" stroke="'+T.ink2+'" stroke-width="1.5"/>';
    lx=cx; ly=cy-stub-6;
  }else if(p.edge==="bottom"){
    cx=bx.x+p.at*bx.w; cy=bx.y+bx.h;
    out+='<line x1="'+f(cx-len/2)+'" y1="'+cy+'" x2="'+f(cx+len/2)+'" y2="'+cy+'" stroke="'+col+'" stroke-width="4.5"/>';
    out+='<line x1="'+f(cx)+'" y1="'+cy+'" x2="'+f(cx)+'" y2="'+(cy+stub)+'" stroke="'+T.ink2+'" stroke-width="1.5"/>';
    lx=cx; ly=cy+stub+11;
  }else if(p.edge==="right"){
    cx=bx.x+bx.w; cy=bx.y+p.at*bx.h;
    out+='<line x1="'+cx+'" y1="'+f(cy-len/2)+'" x2="'+cx+'" y2="'+f(cy+len/2)+'" stroke="'+col+'" stroke-width="4.5"/>';
    out+='<line x1="'+cx+'" y1="'+f(cy)+'" x2="'+(cx+stub)+'" y2="'+f(cy)+'" stroke="'+T.ink2+'" stroke-width="1.5"/>';
    lx=cx+stub+5; ly=cy+3.5; anc="start";
  }else{
    cx=bx.x; cy=bx.y+p.at*bx.h;
    out+='<line x1="'+cx+'" y1="'+f(cy-len/2)+'" x2="'+cx+'" y2="'+f(cy+len/2)+'" stroke="'+col+'" stroke-width="4.5"/>';
    out+='<line x1="'+cx+'" y1="'+f(cy)+'" x2="'+(cx-stub)+'" y2="'+f(cy)+'" stroke="'+T.ink2+'" stroke-width="1.5"/>';
    lx=cx-stub-5; ly=cy+3.5; anc="end";
  }
  if(labelOnly)return p.label?txt(lx,ly,p.label,9.5,SANS,T.ink3,anc):"";
  return out;
}

function knock(x,y,w,h){return '<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(h)+'" fill="'+T.surface+'"/>'}
function txtK(x,y,s,size,fam,col,anc,ls,weight){   /* paper knockout 을 깔고 그린다 */
  var w=String(s).length*(size*.72)+8, ox=anc==="middle"?-w/2:anc==="end"?-w:-4;
  return knock(x+ox,y-size+1.5,w,size+5)+txt(x,y,s,size,fam,col,anc,ls,weight);
}
function txt(x,y,s,size,fam,col,anc,ls,weight){
  return '<text x="'+f(x)+'" y="'+f(y)+'" font-family="'+fam+'" font-size="'+size+
    '" fill="'+col+'" text-anchor="'+(anc||"start")+'"'+(ls?' letter-spacing="'+ls+'"':"")+
    (weight?' font-weight="'+weight+'"':"")+'>'+esc(s)+'</text>';
}

/* ── RENDER ─────────────────────────────────────────────────────────── */
function render(sw,opt){
  opt=opt||{}; var bx=opt.box||B; layout(sw,bx);
  var vb=opt.vb||VB, o="", i;
  o+='<svg viewBox="0 0 '+vb.w+' '+vb.h+'" xmlns="http://www.w3.org/2000/svg">';
  o+='<rect width="'+vb.w+'" height="'+vb.h+'" fill="'+T.surface+'"/>';

  /* 1. BOUNDARY */
  var ghost=sw.state==="empty";
  o+='<rect x="'+bx.x+'" y="'+bx.y+'" width="'+bx.w+'" height="'+bx.h+'" fill="none" stroke="'+
     (ghost?T.ink4:T.ink)+'" stroke-width="'+(ghost?1:2)+'"'+(ghost?' stroke-dasharray="4 4"':"")+'/>';

  /* 2. REGION — band 구분선 + lane 구분선 */
  sw.bands.forEach(function(b,idx){
    if(idx>0)o+='<line x1="'+bx.x+'" y1="'+f(b._y)+'" x2="'+(bx.x+bx.w)+'" y2="'+f(b._y)+
      '" stroke="'+T.hair+'" stroke-width="1" opacity="'+(ghost?.35:1)+'"/>';
    b.lanes.forEach(function(l,j){
      if(j>0)o+='<line x1="'+f(l._x)+'" y1="'+f(b._y+4)+'" x2="'+f(l._x)+'" y2="'+f(b._y+b._h-4)+
        '" stroke="'+T.hair+'" stroke-width="1"/>';
    });
  });

  /* 3. DENSITY */
  var seed=7;
  sw.bands.forEach(function(b){
    b.lanes.forEach(function(l){
      seed+=31;
      o+=marks(l.objects||0,l._x,b._y,l._w,b._h,seed,l.state==="changed"?T.attn:T.ink3);
    });
  });

  /* 4. 원점 — Empty 전용 */
  if(sw.origin){var oc=pt(sw,sw.origin);
    o+='<rect x="'+f(oc.x-5)+'" y="'+f(oc.y-5)+'" width="10" height="10" fill="'+T.ink+'"/>';}

  /* 5. PATH — paper halo 먼저, 그 위에 선 */
  (sw.paths||[]).forEach(function(p,k){
    var d=ortho(sw,p.points);
    var col=p.state==="changed"?T.attn:p.state==="failed"?T.fail:T.ink2;
    var wid=p.state==="changed"?2.2:1.5;
    o+='<path d="'+d+'" fill="none" stroke="'+T.paper+'" stroke-width="5.5" stroke-linejoin="miter"/>';
    o+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+wid+'" stroke-linejoin="miter"'+
       (p.state==="failed"?' stroke-dasharray="3 3"':"")+' data-mk="'+(p.mark==null?-1:p.mark)+'" id="p'+(opt.uid||"")+'_'+k+'"/>';
  });

  /* 6. NODE — NEAR 단계의 해상된 단계들 */
  (sw.nodes||[]).forEach(function(n){
    var q=pt(sw,n.a), s=n.size||8, col=n.state==="changed"?T.attn:n.state==="failed"?T.fail:T.ink;
    o+='<rect x="'+f(q.x-s/2)+'" y="'+f(q.y-s/2)+'" width="'+s+'" height="'+s+'" fill="'+col+'"/>';
  });

  /* 7. PORT */
  (sw.ports||[]).forEach(function(p){o+=port(sw,p)});

  /* 8. TEXT — 예산 강제. §16 TEXT BUDGET.
     후보를 우선순위와 함께 모으고, 상한을 넘으면 낮은 것부터 버린다.
     말줄임(…)을 쓰지 않는다 — 라벨을 줄이는 대신 표시를 포기한다. */
  var cand=[];
  function want(pri,svg){cand.push({p:pri,i:cand.length,s:svg})}

  if(sw.name){
    want(100,txtK(bx.x+bx.w-14,bx.y+4.5,sw.name,13,SANS,ghost?T.ink3:T.ink,"end","-0.02em",700));
  }
  (sw.tags||[]).forEach(function(t){
    var q=pt(sw,t.a);
    want(90,txtK(q.x,q.y,t.label,9,MONO,t.state==="changed"?T.attn:T.ink3,t.anchor||"start",".12em"));
  });
  (sw.nodes||[]).forEach(function(n){
    if(!n.label)return; var q=pt(sw,n.a), s2=n.size||8;
    var col=n.state==="changed"?T.attn:n.state==="failed"?T.fail:T.ink;
    want(75,txtK(q.x+s2/2+6,q.y+3.5,n.label,10.5,SANS,col===T.ink?T.ink2:col,"start",null,n.state?600:null));
  });
  (sw.ports||[]).forEach(function(p){
    if(!p.label)return;
    want(58+2*p.weight,port(sw,p,true));
  });
  sw.bands.forEach(function(b){
    b.lanes.forEach(function(l){
      if(l.label&&l._w>=54&&b._h>=26)
        want(45+l.mass,txtK(f(l._x+l._w/2),f(b._y+b._h-7),l.label,9.5,SANS,T.ink3,"middle",".08em"));
    });
  });
  sw.bands.forEach(function(b){
    if(b.label&&b._m>0&&b._h>=26)
      want(40+b._m,txt(bx.x-9,f(b._y+b._h/2+3.5),b.label,9.5,SANS,T.ink3,"end",".1em"));
  });

  var budget=opt.budget||7;
  var keep=cand.slice().sort(function(a,b){return b.p-a.p||a.i-b.i}).slice(0,budget);
  if(cand.length>budget&&typeof console!=="undefined"&&console.warn)
    console.warn("[JuQode] TEXT BUDGET "+(sw.name||"?")+": "+cand.length+" → "+budget);
  keep.sort(function(a,b){return a.i-b.i}).forEach(function(c){o+=c.s});
  sw._textCount=keep.length;

  o+='</svg>';
  return o;
}

/* 방향 표식 — 경로당 최대 1개. 화살촉이 아니라 5px 채운 삼각형. */
function placeMarks(root){
  root.querySelectorAll('path[data-mk]').forEach(function(p){
    var t=parseFloat(p.getAttribute("data-mk")); if(!(t>=0))return;
    var L; try{L=p.getTotalLength()}catch(e){return} if(!L)return;
    var a=p.getPointAtLength(L*t), b=p.getPointAtLength(Math.min(L,L*t+2));
    var dx=b.x-a.x, dy=b.y-a.y, m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    var nx=-dy, ny=dx, s=5;
    var tri=[a.x+dx*s*.62,a.y+dy*s*.62, a.x-dx*s*.42+nx*s*.5,a.y-dy*s*.42+ny*s*.5,
             a.x-dx*s*.42-nx*s*.5,a.y-dy*s*.42-ny*s*.5];
    var el=document.createElementNS("http://www.w3.org/2000/svg","polygon");
    el.setAttribute("points",tri.map(function(v){return Math.round(v*10)/10}).join(" "));
    el.setAttribute("fill",p.getAttribute("stroke"));
    p.parentNode.appendChild(el);
  });
}

/* ═══ 소프트웨어 명세 6종 ═══════════════════════════════════════════ */
function bands(s,l,d,L){L=L||[];return[{id:"surface",label:L[0],lanes:s},{id:"logic",label:L[1],lanes:l},{id:"data",label:L[2],lanes:d}]}
function lane(id,mass,objects,label,state){return{id:id,mass:mass,objects:objects,label:label,state:state}}

var EMPTY={name:"새 프로젝트",state:"empty",
  bands:bands([lane("s",0,0)],[lane("l",0,0)],[lane("d",0,0)]),
  origin:["logic",.5,.5], ports:[], paths:[]};

var FRONTEND={name:"쇼핑",state:"live",
  bands:bands(
    [lane("s1",4,11,"둘러보기"),lane("s2",2,6,"사는 흐름")],
